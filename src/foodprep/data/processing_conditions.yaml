# Documented processing conditions (R5, docs/research/r5-processing-conditions/).
#
# What documented practice says you have to *do* for a step of a documented dish
# to work, read by foodprep.conditions. Nothing here is derived, predicted or
# simulated: every value is a field some source states, with its evidence ids
# (R2 E/M/A ids, R4 one-letter ids, R5 Q ids in evidence-*.md). A field that is
# absent is unknown. Nothing is ranked.
#
# pairs: (part, operation) as used by documented steps. `default` holds only what
#   the pair's sources agree on; `at: {step: fields}` what one step's sources say.
#   Conflicting instructions are `conflicts` with versions, never averaged.
# sequences: a whole documented route (R3 dish/route or R4 transfer:<id>), raw to
#   plate. Every step has an `endpoint`: readiness (ready for the next operation)
#   or doneness (ready to eat), with the sources that say so (or by: route_order
#   when only the route's own order does). `members`: for each heat step after a
#   join, each member's own endpoint there. `depends`: a stage that exists because
#   of a later one. `misses`: what fails when a stage is skipped, underdone or
#   overdone. `finish`: documented stages after the last route step (rest).
#   `alternatives`: sources that split the work differently, kept apart.
# intermediates: a state you may already have (a part plus R1 operations, or the
#   state after a documented step) and how long it keeps, from a food-safety body,
#   a home-economics association or a cook.
#
# Step address: dish/route/owner/n or transfer:<id>/owner/n (owner = material or
# assembly, n = its 1-based step).
# Fields: start {particle, moisture}, medium [{medium, temp_c, cover}], elapsed
# [{min, max, unit, label}], active {kind}, shifts [{factor, effect}], completion
# [{check}], failure [{check, cause}]; every entry carries `sources`.

vocabulary:
  particle: [whole, halved, split, sliced, grated, leaves, head, grain, ground_coarse, paste, formed, layered, filled, rolled]
  moisture: [dry, soaked, wet, submerged]
  medium: [air_room, water_cold, water_room, water_warm, water_boiling, water_simmering, milk_cream, oil_deep, oil_shallow, oven, steam, microwave, pressure_cooker, fridge, freezer, knife, food_processor, grinder]
  cover: [covered, uncovered, covered_then_uncovered]
  active: [continuous, regular, occasional, none]
  endpoint: [readiness, doneness]
  miss: [skipped, underdone, overdone]
  confidence: [established, documented, conflicting, unknown]

pairs:

  # ---- pulses ----------------------------------------------------------------

  soak_dried_peas:
    name: Soaking dried peas
    part: dried_peas.dried_seed
    op: tremper
    steps: [transfer:pea_falafel/pea/1]
    default:
      start: {particle: [whole, split], moisture: [dry], sources: [P4, P15, Q105]}
      medium:
        - {medium: water_cold, note: "three times their volume (P4); 1:3 by weight (P15)", sources: [P4, P15]}
      active: {kind: none, sources: [Q103, Q105], note: "waiting"}
      shifts:
        - {factor: soak time, effect: "drives water uptake and softness (measured for lentils, 10-13 h best); yellow pea took up the least water of ten pulses", sources: [P15]}
        - {factor: whole or split, effect: "whole peas are soaked overnight even for soup; split peas are not", sources: [Q104, Q105, Q106]}
    at:
      transfer:pea_falafel/pea/1:
        role: raw paste for falafel (the peas are ground raw and never cooked before frying)
        elapsed:
          - {min: 6, max: 6, unit: h, sources: [P1]}
          - {label: "8 h or overnight", sources: [P6]}
          - {label: overnight, sources: [P2, P4, P5]}
          - {min: 12, unit: h, label: "at least 12 h", sources: [P3, Q102]}
          - {min: 12, max: 12, unit: h, label: "about 12 h", sources: [P15]}
        failure:
          - {check: "falafel dry and hard", cause: "linked by the only controlled test to low water uptake of yellow pea; not shown for soak time", sources: [P15]}
    conflicts:
      - topic: soak length for falafel
        versions:
          - {says: "6 h", sources: [P1]}
          - {says: "overnight", sources: [P2, P4, P5]}
          - {says: "at least 12 h", sources: [P3, Q102]}
      - topic: whether split peas are soaked at all
        versions:
          - {says: "no soak for soup: split peas cook without it", sources: [Q104, Q105, Q106]}
          - {says: "always soaked for a raw falafel paste", sources: [P1, P3, P4, P5]}
        note: "a difference of role, not a disagreement: the soak exists for the raw grind"
    confidence: documented
    gaps:
      - "an observable 'soaked enough' test for dried peas (doubling, bite, knife): not found"
      - "an over-soak failure for peas"
      - "Finnish packet instructions (Pirkka, Myllyn Paras, Rainbow, Lidl): not reachable"
      - "a Finnish or Swedish pea-falafel recipe"

  soak_chickpeas:
    name: Soaking dried chickpeas for falafel
    part: chickpea.dried_seed
    op: tremper
    steps: [falafel/raw_soaked/chickpea/1]
    default:
      start: {particle: [whole], moisture: [dry], sources: [Q108, Q110]}
      medium:
        - {medium: water_cold, note: "plenty: about 10 cm over (Q109), 1.5 l per 125 g (Q110)", sources: [Q108, Q116, Q118, Q109, Q110]}
        - {medium: water_room, sources: [Q110, Q111]}
        - {medium: water_warm, note: "water changed", sources: [M2c]}
      active: {kind: occasional, sources: [M2c, Q111, Q109], note: "change or top up the water once; otherwise covered and left (Q110)"}
      shifts:
        - {factor: fridge soak, effect: "much slower", sources: [Q111]}
        - {factor: age and size, effect: "older and larger chickpeas need longer", sources: [Q111]}
        - {factor: a hot kitchen, effect: "shorten the soak", sources: [Q111]}
      completion:
        - {check: "about doubled (or tripled) in size", sources: [Q109, Q117]}
        - {check: "swollen but not cooked", sources: [Q108]}
        - {check: "soft enough to chop easily with a knife, still firm and mealy, hydrated through", sources: [Q111]}
        - {check: "a slight sprout is the best sign", sources: [Q111]}
      failure:
        - {check: "still hard and dry inside", cause: "too short; soak longer", sources: [Q111]}
        - {check: "the falafel falls apart or turns mushy", cause: "cooked or canned chickpeas used instead of soaked raw ones", sources: [Q108, Q109, Q114, Q115, Q117, Q107]}
    at:
      falafel/raw_soaked/chickpea/1:
        role: raw paste for falafel
        elapsed:
          - {min: 4, unit: h, label: "at least 4 h", sources: [Q118]}
          - {min: 8, unit: h, label: "at least 8 h", sources: [Q110, Q109]}
          - {min: 12, max: 12, unit: h, label: "warm water, changed", sources: [M2c]}
          - {label: overnight, sources: [M2a, Q113, Q114, Q116, Q120]}
          - {min: 16, max: 24, unit: h, label: "at least 16, ideally 24", sources: [Q111]}
          - {min: 24, max: 24, unit: h, sources: [M2b, Q107]}
    conflicts:
      - topic: soak length
        versions:
          - {says: "at least 4 h", sources: [Q118]}
          - {says: "overnight or 8-12 h", sources: [M2a, M2c, Q110, Q116]}
          - {says: "24 h", sources: [M2b, Q107, Q111]}
        note: "Q109 says 8 h in the text and 24 h on its recipe card"
      - topic: may they be heated
        versions:
          - {says: "quick soak: boiled 5 min, then stand 1 h", sources: [Q109]}
          - {says: "never boiled after the soak; swollen, not cooked", sources: [Q114, Q108]}
    confidence: established
    note: "Soaked raw and never cooked is established (6+ sources); the duration conflicts."
    gaps:
      - "an over-soak failure for chickpeas"
      - "a 'splits in half' check"

  soak_urad_dal:
    name: Soaking urad dal for medu vada
    part: urad_dal.dried_seed
    op: tremper
    steps: [medu_vada/beaten_paste/dal/1]
    default:
      start: {particle: [split], moisture: [dry], sources: [Q122, Q124], note: "skinless; whole skinless preferred (Q124)"}
      medium:
        - {medium: water_room, note: "fresh water after washing and rubbing", sources: [Q122]}
      active: {kind: none, sources: [Q122, Q124]}
      shifts:
        - {factor: grinder, effect: "a wet grinder wants a shorter soak than a mixie", sources: [Q123, Q122]}
        - {factor: organic or old dal, effect: "organic dal tolerates longer; old yellowish dal goes flat and dense", sources: [Q122]}
      completion:
        - {check: "judged on the next stage: a drop of the ground batter floats in water and holds a stiff peak", sources: [Q122, Q123]}
      failure:
        - {check: "the vada soaks up oil; batter watery or runny and breaks apart", cause: "over-soaked", sources: [A3a, Q122]}
        - {check: "hard, dense vada", cause: "under-soaked", sources: [Q122]}
    at:
      medu_vada/beaten_paste/dal/1:
        elapsed:
          - {min: 3, max: 3, unit: h, label: "not longer", sources: [A3a]}
          - {min: 2, max: 3, unit: h, label: "at most", sources: [Q124]}
          - {min: 4, max: 5, unit: h, label: "3 h possible, up to 8 h for organic dal", sources: [Q122]}
          - {label: overnight, sources: [A3b]}
    conflicts:
      - topic: how long
        versions:
          - {says: "overnight", sources: [A3b]}
          - {says: "an upper limit of 3 h", sources: [A3a, Q124]}
          - {says: "an upper limit of 4 h (method) or 45-60 min (tips, wet grinder)", sources: [Q123]}
          - {says: "4-5 h, up to 8 h", sources: [Q122]}
    confidence: conflicting
    note: "Over-soaking gives oily vada (established); the limit itself conflicts."
    gaps:
      - "an observable soaked-enough sign on the dal itself"

  soak_black_eyed_beans:
    name: Soaking black-eyed beans to skin them
    part: black_eyed_bean.dried_seed
    op: tremper
    steps: [akara/aerated_paste/beans/1, moi_moi/steamed/beans/1]
    default:
      start: {particle: [whole], moisture: [dry], sources: [A18c, Q130], note: "sometimes cracked first"}
      active: {kind: none, sources: [Q127, A18c], note: "the soak is waiting; the skinning after it is continuous hands-on work, about 10 min (Q127)"}
      shifts:
        - {factor: variety, effect: "oloyin beans need a shorter soak", sources: [Q126]}
        - {factor: grinder, effect: "a market grinder needs no long soak; a home blender about 2 h", sources: [Q128]}
      completion:
        - {check: "the skins swell or start to wrinkle", sources: [A18b, Q129]}
        - {check: "the skins come off easily when rubbed and float off on rinsing", sources: [Q126, Q129, Q130, A18b]}
      failure:
        - {check: "the texture is spoiled", cause: "hot water part-cooks the beans", sources: [A19a]}
        - {check: "the skins stay on", cause: "over-soaked: skin and bean bond", sources: [Q126]}
        - {check: "thicker, harder-to-digest moi moi", cause: "skins left on", sources: [Q130]}
    at:
      moi_moi/steamed/beans/1:
        medium:
          - {medium: water_room, note: "not hot", sources: [A19a]}
        elapsed:
          - {min: 15, max: 15, unit: min, sources: [A19a]}
          - {min: 3, max: 3, unit: min, label: "then a second soak of at least 4 h or overnight after skinning", sources: [Q129]}
          - {min: 1, max: 1, unit: h, sources: [Q130]}
      akara/aerated_paste/beans/1:
        elapsed:
          - {min: 15, max: 30, unit: min, sources: [A18b]}
          - {min: 1.5, max: 1.5, unit: h, sources: [A18c]}
          - {min: 5, max: 10, unit: min, label: "under 5 for oloyin", sources: [Q126]}
    conflicts:
      - topic: water temperature
        versions:
          - {says: "room temperature, not hot", sources: [A19a]}
          - {says: "warm or hot water", sources: [Q125, Q132]}
      - topic: length
        versions:
          - {says: "minutes (3-10)", sources: [Q129, Q125, Q126]}
          - {says: "15 min to 1.5 h", sources: [A19a, A18b, Q130, A18c]}
          - {says: "overnight", sources: [Q132]}
    confidence: established
    note: "The endpoint (skins come off easily) is established; time and temperature conflict."

  grind_soaked_peas:
    name: Grinding soaked raw peas
    part: dried_peas.dried_seed
    op: broyer
    steps: [transfer:pea_falafel/pea/2]
    default:
      start: {particle: [whole, split], moisture: [soaked], sources: [P4, P15], note: "drained"}
      medium:
        - {medium: food_processor, sources: [P1, P4, P5, P15]}
        - {medium: grinder, note: "the fine disc of a meat grinder", sources: [P3]}
      active: {kind: continuous, sources: [P4, P15], note: "pulse and scrape; not timed"}
      completion:
        - {check: "a mouldable batter", sources: [P15]}
      failure:
        - {check: "dense falafel", cause: "ground too fine", sources: [P4]}
        - {check: "the paste can only be pressed, not rolled; sticky", cause: "texture of pea paste", sources: [P2, P6]}
    conflicts:
      - topic: how fine
        versions:
          - {says: "coarse: a coarse pea 'flour', like breadcrumbs, not a puree", sources: [P4, P10, P5, P9]}
          - {says: "fine couscous to as fine as possible", sources: [P1, P2, P3]}
    confidence: conflicting
    gaps:
      - "a pea-specific grinding source in Finnish, Swedish or German"

  grind_soaked_chickpeas:
    name: Grinding soaked raw chickpeas
    part: chickpea.dried_seed
    op: mixer
    steps: [falafel/raw_soaked/chickpea/2]
    default:
      start: {particle: [whole], moisture: [soaked], sources: [Q108, Q113, Q121], note: "drained and patted dry, with raw onion and herbs"}
      medium:
        - {medium: food_processor, note: "short pulses, scraping down", sources: [Q108, Q110, Q109]}
        - {medium: grinder, note: "fine plate, twice", sources: [M2b]}
      active: {kind: continuous, sources: [Q108, Q110]}
      elapsed:
        - {min: 3, max: 4, unit: min, sources: [Q118]}
      shifts:
        - {factor: processing time, effect: "over-processing makes the mix wetter", sources: [Q116]}
      completion:
        - {check: "the mixture holds together when squeezed or pressed in the hand", sources: [Q109, Q111, Q120]}
      failure:
        - {check: "it will not hold its shape", cause: "too coarse, or under-processed", sources: [Q110, Q109]}
        - {check: "it falls apart", cause: "too smooth", sources: [Q108]}
        - {check: "wet and hard to handle; moves around easily", cause: "over-processed or too wet", sources: [Q116, Q113]}
    conflicts:
      - topic: how fine
        versions:
          - {says: "very fine, fine couscous, very smooth", sources: [Q109, Q111, Q113, M2b]}
          - {says: "coarse but formable, grainy, coarse breadcrumbs", sources: [Q108, Q121, Q116, M2b]}
        note: "M2b gives both, in two recipes on one page"
    confidence: established
    note: "The squeeze test is established (3 sources); fineness conflicts."

  rest_pulse_paste:
    name: Resting and chilling a raw pulse paste
    part: falafel paste
    op: reposer
    steps: [falafel/raw_soaked/paste/1, transfer:pea_falafel/paste/1]
    default:
      start: {particle: [paste], moisture: [soaked], sources: [Q110, P4]}
      medium:
        - {medium: fridge, cover: covered, sources: [Q107, Q114, Q121]}
      active: {kind: none, sources: [Q110], note: "mix again after resting (Q110)"}
      shifts:
        - {factor: onion and herb water, effect: "makes the rest more necessary", sources: [Q115]}
      completion:
        - {check: "firmer, binds and shapes easily", sources: [Q108, Q113, Q114, Q116]}
      failure:
        - {check: "falls apart in hot oil, or spreads and cracks in the oven", cause: "rest skipped", sources: [Q114, Q115]}
    at:
      falafel/raw_soaked/paste/1:
        elapsed:
          - {label: "none needed", sources: [Q109, M2a]}
          - {min: 20, max: 30, unit: min, sources: [Q108]}
          - {min: 30, unit: min, label: "at least 30 min", sources: [Q113, Q114, Q116]}
          - {min: 1, max: 2, unit: h, sources: [Q110, M2c, Q107]}
          - {label: "1 h to overnight", sources: [M2b]}
      transfer:pea_falafel/paste/1:
        elapsed:
          - {min: 15, unit: min, label: "at least 15 min", sources: [P4]}
          - {min: 10, max: 10, unit: min, sources: [P15]}
    conflicts:
      - topic: is a rest needed
        versions:
          - {says: "no rest", sources: [Q109, M2a]}
          - {says: "required, or the paste falls apart", sources: [Q114, Q115]}
      - topic: why rest
        versions:
          - {says: "to shape and hold", sources: [Q108, Q114, Q116]}
          - {says: "so the soda can work", sources: [Q113]}
          - {says: "so the flavours blend", sources: [Q121]}
    confidence: established
    note: "A chill helps holding (5+ sources); whether it is needed conflicts."

  fry_pulse_paste:
    name: Deep-frying a raw pulse paste
    part: falafel paste
    op: frire
    steps: [falafel/raw_soaked/paste/3, transfer:pea_falafel/paste/3]
    default:
      start: {particle: [formed], moisture: [soaked], sources: [Q111, Q110, P4], note: "balls of about 1 tbsp, walnut size, 30 g"}
      medium:
        - {medium: oil_deep, temp_c: [170, 190], note: "test: bubbles at a wooden spoon, a bread cube browns in about 15 s, or fry one test ball", sources: [P4, Q110, Q108, P15, Q113, Q116, Q121, Q111, Q114, P2, Q107]}
      elapsed:
        - {min: 2, max: 5, unit: min, sources: [P15, Q110, Q116, Q120, P4, Q111, P2, Q109]}
      active: {kind: regular, sources: [Q111, Q116, Q121, Q109], note: "batches of 5-6, turned once"}
      shifts:
        - {factor: crowding, effect: "drops the oil temperature", sources: [Q113, Q120, Q121, P4]}
        - {factor: ball size, effect: "large balls cook unevenly", sources: [Q108, Q113]}
        - {factor: frozen balls, effect: "need extra time", sources: [Q109]}
      completion:
        - {check: "golden to deep brown", sources: [Q109, Q111, Q120, Q110]}
        - {check: "crisp outside, soft and fluffy inside, cooked through", sources: [Q108, Q111, Q116]}
        - {check: "the balls float", sources: [Q118]}
      failure:
        - {check: "falls apart in the oil", cause: "canned or cooked chickpeas; too wet; too coarse or too smooth; not chilled; loosely packed; crowded", sources: [Q108, Q109, Q113, Q114, Q115, Q110, P4]}
        - {check: "greasy and soft", cause: "oil too cool or crowded", sources: [Q108, Q113, Q120]}
        - {check: "charred outside, raw centre", cause: "oil too hot", sources: [Q113]}
        - {check: "dense and dry", cause: "starch added as binder (chickpea); yellow pea itself", sources: [Q115, P15]}
        - {check: "mealy, raw taste", cause: "no soda", sources: [Q111]}
    conflicts:
      - topic: oil temperature
        versions:
          - {says: "170 C", sources: [P4, Q110]}
          - {says: "180-190 C", sources: [Q121, Q116, P15]}
      - topic: medium
        versions:
          - {says: "deep oil", sources: [Q108, Q110, Q111]}
          - {says: "a quarter inch of oil, medium heat", sources: [Q109]}
    confidence: established
    gaps:
      - "an internal temperature"

  steam_bean_paste:
    name: Steaming black-eyed bean paste (moi moi)
    part: moi moi paste
    op: cuire_vapeur
    steps: [moi_moi/steamed/paste/1]
    default:
      start: {particle: [paste], moisture: [soaked], sources: [Q129, A19b], note: "like a light cake batter or yoghurt; in oiled ramekins, bowls, leaves or a loaf pan"}
      medium:
        - {medium: steam, cover: covered, note: "shallow water, not over halfway up the ramekins", sources: [Q129, Q131, Q132]}
      active: {kind: occasional, sources: [A19a, Q131, Q132], note: "top up the water"}
      shifts:
        - {factor: container size and material, effect: "large pans and foil bowls take much longer", sources: [Q129, Q131, Q132]}
        - {factor: position in the steamer, effect: "the top row takes longer", sources: [Q131]}
      completion:
        - {check: "a knife or skewer comes out clean or with only an oily smear; moist but firm", sources: [A19a, Q129, Q131]}
        - {check: "firm to the touch with no wet residue", sources: [A19b, Q130]}
      failure:
        - {check: "paste on the knife", cause: "not cooked yet", sources: [Q131]}
        - {check: "watery, soft, will not mould", cause: "too much water in the paste", sources: [Q132, A19a]}
        - {check: "hard to set", cause: "tomato in the paste", sources: [A19a]}
        - {check: "denser and drier", cause: "baked instead of steamed", sources: [Q130, Q132]}
    at:
      moi_moi/steamed/paste/1:
        elapsed:
          - {min: 30, max: 30, unit: min, sources: [A19b, Q130]}
          - {min: 45, max: 60, unit: min, sources: [A19a, Q132]}
          - {min: 105, max: 120, unit: min, label: "one large pan", sources: [Q132]}
    conflicts:
      - topic: heat
        versions:
          - {says: "low", sources: [Q129]}
          - {says: "medium", sources: [A19a, Q132]}
      - topic: time
        versions:
          - {says: "about 30 min", sources: [A19b]}
          - {says: "45-60 min", sources: [A19a, Q132]}
    confidence: established
    note: "The knife or skewer endpoint is established (5 sources)."
    gaps:
      - "how long cooked moi moi or the raw batter keeps"

  # ---- gratin ----------------------------------------------------------------

  blanch_rutabaga:
    name: Blanching rutabaga slices for a gratin
    part: rutabaga.root
    op: blanchir
    steps: [transfer:rutabaga_gratin/rutabaga/3]
    default:
      start: {particle: [sliced], moisture: [dry], sources: [Q231, Q232, G1], note: "peeled; 2-3 mm (Q231), 4 mm (Q232)"}
      medium:
        - {medium: water_boiling, note: "lightly salted; then rinsed cold and patted dry (Q231), or drained really well (Q233)", sources: [Q231, Q233, G1]}
        - {medium: water_simmering, sources: [Q232]}
      active: {kind: occasional, sources: [Q231], note: "time it, then drain, rinse and dry"}
      shifts:
        - {factor: slice thickness, effect: "thicker slices get a longer pre-cook", sources: [Q232]}
        - {factor: size and age of the root, effect: "large or old roots are tougher and slower", sources: [Q208, Q229]}
      failure:
        - {check: "the rutabaga is still crunchy or firm when the gratin is otherwise done", cause: "blanch skipped (raw thin slices)", sources: [G20, G21]}
    at:
      transfer:rutabaga_gratin/rutabaga/3:
        role: a gratin layer that the bake finishes (readiness, not doneness)
        elapsed:
          - {min: 3, max: 3, unit: min, label: "2-3 min more for a softer result", sources: [Q231, G1]}
          - {min: 4, max: 4, unit: min, sources: [Q233]}
          - {min: 5, max: 5, unit: min, sources: [Q232]}
          - {min: 10, max: 10, unit: min, label: "almost tender", sources: [G16, G18]}
        completion:
          - {check: "crisp-tender: softened slightly, not fully cooked", sources: [Q231, Q232]}
          - {check: "almost tender (after about 10 min)", sources: [G18]}
    conflicts:
      - topic: how long before the gratin bake
        versions:
          - {says: "3-5 min", sources: [G1, Q231, Q232, Q233]}
          - {says: "about 10 min, almost tender", sources: [G16, G18]}
    confidence: established
    note: "In mash and casserole dishes (lanttulaatikko, rotmos) the same part and operation runs to fully soft (Q210, Q211, Q216, Q218); whole lanttu that is grilled later stops at 'almost cooked' (Q213). In the gratin it stops at a partial, still-firm state."
    gaps:
      - "a Finnish or Swedish source that blanches lanttu or kalrot slices for a gratin"
      - "a test on the blanched slice itself (knife, bend)"
      - "the over-blanch failure (slices breaking or mushy in the bake)"

  bake_gratin:
    name: Baking a layered potato or root gratin
    part: gratin (layered)
    op: cuire_four
    steps:
      - gratin_dauphinois/raw_long_bake/gratin/1
      - transfer:rutabaga_gratin/gratin/1
