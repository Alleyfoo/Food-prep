sequences:

  # ---- pulses ----------------------------------------------------------------

  falafel/raw_soaked:
    name: Falafel from raw soaked chickpeas
    steps:
      falafel/raw_soaked/chickpea/1:
        endpoint: {kind: readiness, sources: [Q117, Q108]}
        completion:
          - {check: "swollen but not cooked; reaches a blendable consistency", sources: [Q108, Q117]}
      falafel/raw_soaked/chickpea/2:
        endpoint: {kind: readiness, sources: [Q109, Q111]}
      falafel/raw_soaked/onion/1:
        endpoint: {kind: readiness, by: route_order}
      falafel/raw_soaked/onion/2:
        endpoint: {kind: readiness, sources: [Q116]}
        completion:
          - {check: "roughly chopped and added raw to the processor", sources: [Q116]}
        failure:
          - {check: "a delicate mix that falls apart", cause: "excess water from the onion", sources: [Q115]}
      falafel/raw_soaked/paste/1:
        endpoint: {kind: readiness, sources: [Q108, Q114]}
      falafel/raw_soaked/paste/2:
        endpoint: {kind: readiness, sources: [Q109, Q113]}
        completion:
          - {check: "small, firmly compacted balls", sources: [Q109, Q113, Q108]}
        failure:
          - {check: "breaks or cooks unevenly", cause: "loosely packed or large", sources: [Q108, Q113]}
      falafel/raw_soaked/paste/3:
        endpoint: {kind: doneness, sources: [Q108, Q111, Q116]}
    members:
      falafel/raw_soaked/paste/3:
        chickpea:
          completion:
            - {check: "cooked through and fluffy inside; with soda it loses the mealy raw taste", sources: [Q111, Q116]}
          failure:
            - {check: "raw centre", cause: "oil too hot", sources: [Q113]}
        onion:
          note: "no source states the onion's own endpoint inside the ball"
    depends:
      - {step: falafel/raw_soaked/chickpea/1, because: falafel/raw_soaked/chickpea/2, says: "the soak exists so the raw seed can be ground", sources: [Q117]}
      - {step: falafel/raw_soaked/chickpea/1, because: falafel/raw_soaked/paste/3, says: "kept raw, never cooked or canned, because the raw paste must set and hold in the oil", sources: [Q108, Q109, Q114, Q115, Q117]}
      - {step: falafel/raw_soaked/chickpea/2, because: falafel/raw_soaked/paste/3, says: "the grind is for holding: too coarse will not hold, too smooth falls apart", sources: [Q110, Q108]}
      - {step: falafel/raw_soaked/paste/1, because: falafel/raw_soaked/paste/3, says: "the chill exists because the paste has to hold in the oil", sources: [Q114, Q115]}
      - {step: falafel/raw_soaked/paste/2, because: falafel/raw_soaked/paste/3, says: "firm compaction is for frying", sources: [Q113]}
    misses:
      - {step: falafel/raw_soaked/chickpea/1, when: overdone, failure: "cooked or canned chickpeas instead of soaked raw ones: the balls fall apart or turn mushy", sources: [Q108, Q109, Q114, Q115]}
      - {step: falafel/raw_soaked/chickpea/1, when: underdone, failure: "hard inside, less fluffy falafel", sources: [Q111]}
      - {step: falafel/raw_soaked/chickpea/2, when: overdone, failure: "wet and smooth, hard to handle, falls apart", sources: [Q116, Q108]}
      - {step: falafel/raw_soaked/paste/1, when: skipped, failure: "falls apart in hot oil", sources: [Q114, Q115]}
    alternatives:
      - {name: baked, says: "the raw paste baked at 185-225 C for 20-30 min, or air-fried; without the chill it spreads and cracks; less crisp", sources: [Q107, Q121, Q108, Q114]}
      - {name: cooked chickpeas, says: "chickpeas cooked about 30 min to tender, bound with flour, fried about 10 min", sources: [Q119]}
      - {name: quick soak, says: "boiled 5 min and left 1 h, then the raw route (conflicts with never boiling)", sources: [Q109, Q114]}
      - {name: frozen balls, says: "shaped balls frozen, fried from frozen, or thawed in the fridge first", sources: [Q109, Q112, Q114, Q115]}

  transfer:pea_falafel:
    name: Falafel from Finnish dried peas (R4 transfer)
    steps:
      transfer:pea_falafel/onion/1:
        endpoint: {kind: readiness, by: route_order}
      transfer:pea_falafel/onion/2:
        endpoint: {kind: readiness, sources: [P2, P4]}
        completion:
          - {check: "chopped and ground with the peas or mixed in", sources: [P2, P4]}
      transfer:pea_falafel/pea/1:
