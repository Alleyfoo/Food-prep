        completion:
          - {check: "sliced 2-3 mm, last, and not rinsed afterwards", sources: [Q231, Q235, Q225]}
        note: "the potato goes into the gratin raw (Q231) or gets 1 min (Q232)"
      transfer:rutabaga_gratin/rutabaga/1:
        endpoint: {kind: readiness, by: route_order}
      transfer:rutabaga_gratin/rutabaga/2:
        endpoint: {kind: readiness, sources: [Q231, Q232]}
        completion:
          - {check: "sliced 2-3 mm (4 mm with a longer pre-cook)", sources: [Q231, Q232]}
      transfer:rutabaga_gratin/rutabaga/3:
        endpoint: {kind: readiness, sources: [Q231, Q232, G18]}
        note: "'crisp tender', 'will not be fully cooked': the bake finishes it"
      transfer:rutabaga_gratin/gratin/1:
        endpoint: {kind: doneness, sources: [Q231, Q234, Q232]}
    members:
      transfer:rutabaga_gratin/gratin/1:
        potato:
          completion:
            - {check: "tender: a knife meets no resistance", sources: [Q234, Q232]}
        rutabaga:
          completion:
            - {check: "some give, al dente; if still firm, 5 min more under foil", sources: [Q231]}
            - {check: "no resistance, completely tender", sources: [Q232, Q233, Q234]}
          failure:
            - {check: "still crunchy when the potato is done", cause: "not blanched", sources: [G20, G21]}
        cream:
          note: "no source states a thickened-cream endpoint for a rutabaga gratin; flour (Q231, G7) and potato starch (Q235) are the stated thickeners"
    depends:
      - {step: transfer:rutabaga_gratin/rutabaga/3, because: transfer:rutabaga_gratin/gratin/1, says: "rutabaga is a very dense root and needs longer than potato; denser roots cook through more slowly in the same bake", sources: [Q231, Q234]}
