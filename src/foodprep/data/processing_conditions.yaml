      - {step: transfer:broccoli_stem_patties/stem/1, when: skipped, failure: "stringy fibres after grating, picked out by hand", sources: [B1]}
    alternatives:
      - {name: precooked stem, says: "stem boiled 8-10 min or steamed, then blended into the mass", sources: [B4, B11, B16, B17, B18]}
      - {name: baked, says: "baked as the base carrot patties are", sources: [E18a, B18]}
    gaps:
      - "whether a peeled, grated raw stem is cooked through and not stringy in a patty that is otherwise done (the kitchen test's question)"
      - "any reported failure of a broccoli-stem patty"

intermediates:
  soaked_dried_peas:
    name: Soaked dried peas
    part: dried_peas.dried_seed
    after: [tremper]
    keeps:
      - {where: fridge, how: "during the soak, when soaking longer than 4 h (beans)", basis: food_safety, sources: [Q526]}
      - {where: fridge, how: "during the soak, when soaking longer than 12 h (beans)", basis: food_safety, sources: [Q525]}
      - {where: "-", how: "soak water discarded and the pulses rinsed (beans, legumes)", basis: food_safety, sources: [Q524, Q525, Q526]}
    note: "How long soaked, uncooked pulses keep: not found in any source. The two soak-temperature thresholds conflict and are kept apart. Ruokavirasto says beans must never be eaten only soaked (Q505); no body read addresses soaked peas or chickpeas that are then deep-fried."

  soaked_chickpeas:
    name: Soaked dried chickpeas
    part: chickpea.dried_seed
