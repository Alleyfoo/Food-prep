        failure:
          - {check: "might fall apart", cause: "crowding the pan", sources: [P4]}
          - {check: "too dry and hard", cause: "yellow pea (the only controlled test)", sources: [P15]}
    members:
      transfer:pea_falafel/paste/3:
        pea:
          failure:
            - {check: "hard and dry in the mouth", cause: "yellow pea's low water uptake", sources: [P15]}
          note: "no pea-specific 'cooked through inside' endpoint was found"
        onion:
          note: "no source states the onion's own endpoint inside the ball"
    depends:
      - {step: transfer:pea_falafel/pea/1, because: transfer:pea_falafel/pea/2, says: "split peas need no soak to be cooked in soup, but are soaked for falafel: the soak exists for the raw grind", sources: [Q104, Q105, Q106, P1, P3, P4, P5]}
      - {step: transfer:pea_falafel/pea/2, because: transfer:pea_falafel/paste/3, says: "a coarse grind, because a fine one makes the fried falafel dense", sources: [P4]}
      - {step: transfer:pea_falafel/paste/1, because: transfer:pea_falafel/paste/2, says: "chilled so it shapes", sources: [P4]}
    misses:
      - {step: transfer:pea_falafel/pea/2, when: overdone, failure: "dense falafel", sources: [P4]}
    alternatives:
      - {name: par-cooked and baked, says: "a 30 min hot soak, boiled 4-6 min, baked at 190 C for 25-30 min", sources: [P7]}
      - {name: raw and baked, says: "baked at 180 C for 20 min", sources: [P8, P9]}
      - {name: shallow-fried, says: "about 2 min per side", sources: [P1, P5]}
    gaps:
      - "a soaked-enough test for peas"
      - "a 'cooked through' check for the pea interior"
      - "whether frying counts as the treatment a pea packet requires before eating (Q102 says dried peas must not be eaten untreated)"

  # ---- gratin ----------------------------------------------------------------

  transfer:rutabaga_gratin:
    name: Potato and rutabaga gratin, rutabaga blanched (R4 transfer)
    steps:
      transfer:rutabaga_gratin/potato/1:
        endpoint: {kind: readiness, by: route_order}
