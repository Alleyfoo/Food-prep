# What a technique needs from a part, and what it does to it — the second
# input of the possibility generator (foodprep.possibilities).
#
# requires   property conditions on the part: "x" (exactly), ">=x", "<=x" for
#            levels; true/false for flags. All must hold.
# effects    what the technique produces; the acid mechanisms match on these
#            (browning, softens, concentrates, crisp, smooth, extracts).
# except     parts the conditions let through but a cook would not do this to,
#            as ingredient.part.
# corpus     which RecipeNLG technique word stands for it
#            (part_evidence.TECHNIQUES). Rough: braise is counted as boil.
#
# Pickling is not a technique here: it is the acid mechanism `quick_pickle`
# acting on a raw part, so it appears once per acid source.

techniques:
  raw:
    requires: {raw_ok: true}
    effects: []
    does: "Cut and eaten raw"
    corpus: raw
  massage:
    requires: {leafy: true, toughness: ">=medium", raw_ok: true}
    effects: [softens]
    does: "Worked raw with salt and oil until the leaves darken and soften"
    corpus: raw
  steam:
    requires: {liquid: false, fibre: ">=medium", toughness: "<=medium"}
    except: [tomato.skin]
    effects: [softens]
    does: "Steamed until just tender"
    corpus: steam
  roast:
    requires: {liquid: false, water: "<=high"}
    effects: [browning, concentrates]
    does: "Roasted hot until the edges brown"
    corpus: roast
  stir_fry:
    except: [avocado.flesh]
    requires: {liquid: false, toughness: "<=medium"}
    effects: [browning]
    does: "Cut thin and stir-fried over high heat"
    corpus: stir_fry
  fry:
    requires: {liquid: false, water: "<=medium"}
    effects: [browning, crisp]
    does: "Fried in fat until crisp"
    corpus: fry
  braise:
    except: [tomato.skin]
    requires: {liquid: false, fibre: ">=medium"}
    effects: [softens]
    does: "Cooked slowly in a little liquid until soft"
    corpus: boil
  simmer:
    except: [avocado.flesh]
    requires: {}
    effects: [softens, extracts]
    does: "Simmered in a stock or sauce"
    corpus: boil
  dry:
    requires: {thin: true, water: "<=medium"}
    effects: [concentrates, crisp]
    does: "Dried until brittle; can be ground to a powder"
    corpus: dry
  puree:
    requires: {toughness: "<=low"}
    effects: [smooth]
    does: "Blended or mashed smooth"
    corpus: soup
