        materials:
          aubergine:
            from: aubergine.fruit
            recipes: [A12b]
            steps:
              - {op: emincer, evidence: "hinged 'slider bun' pockets"}
              - {op: saumurer, evidence: "soaked 15 min in salt water and dried well: salting draws moisture so it crisps"}
        assemblies:
          filling:
            op: melanger
            recipes: [A12b]
            roles: {body: minced_meat, flavour: [garlic, soy_sauce, spices]}
            note: "stirred one way until sticky: it helps the filling stay together"
          box:
            op: farcir
            recipes: [A12b]
            roles: {container: aubergine, filling: filling}
            evidence: "filled without overstuffing"
          batter:
            op: melanger
            recipes: [A12b]
            roles: {body: ice_water, dry_phase: wheat_flour, flavour: salt}
            state: {sets_on_heat: true}
            because: [wheat_flour]
          coated:
            op: revetir
            recipes: [A12b]
            roles: {piece: box, coat: batter}
            steps:
              - {op: frire, evidence: "first fry 176 C until set and pale"}
              - {op: frire, evidence: "second fry 190 C until golden: double frying is 'the key' and keeps it crisp after cooling"}
        result: coated
        final: {state: {cooked: true, crisp: true}, recipes: [A12b]}
        gaps:
          - {kind: model, note: "no operation makes a hinged pocket; the container check fails"}
          - {kind: scope, note: "pork filling"}

  moi_moi:
    name: Moi moi (moin moin)
    tradition: Nigeria; English sources by Nigerian authors
    split: held_out
    routes:
      steamed:
        recipes: [A19a, A19b]
        patterns: [C3]
        holds_by: [H4, H7]
        why: >
          The same raw skinned bean paste as akara, but not aerated and with
          oil stirred in, kept pourable but not watery and steam-set in a
          mould (ramekin, leaf or foil). Too much water and it will not mould;
          tomato keeps it from setting.
        materials:
          beans:
            from: black_eyed_bean.dried_seed
            recipes: [A19a, A19b]
            steps:
              - {op: tremper, evidence: "about 15 min in room-temperature water: hot water part-cooks the beans and spoils the texture (A19a)"}
              - {op: decortiquer, keep: inner, discard: [skins], evidence: "pulse-blended in bursts, skins rubbed and floated off, sieved (A19a)"}
              - {op: mixer, evidence: "very smooth with about 1 cup water (A19a), or stock and no water (A19b); too much water 'wouldn't mold well'"}
          onion:
            from: onion.bulb
            recipes: [A19a, A19b]
            steps: [eplucher, hacher]
        assemblies:
          paste:
            op: melanger
            recipes: [A19a, A19b]
            roles: {body: beans, fat: vegetable_oil, flavour: [onion, spices, crayfish, salt]}
            evidence: "about ¼ cup oil stirred in (no reason given); like shop-bought yoghurt (A19b)"
            expects:
              - member: beans
                state: {aerated: false, cooked: false}
                because: "the raw paste of akara, not aerated (A19a, A19b)"
                recipes: [A19a, A19b]
            steps:
              - {op: cuire_vapeur, evidence: "in greased ramekins ¾ full or wrapped in leaf, husk or foil; steamed 45-60 min (A19a), about 30 min (A19b), until firm with no wet residue"}
        result: paste
        final: {state: {cooked: true}, recipes: [A19a, A19b]}
        gaps:
          - {kind: model, note: "the mould (ramekin, leaf, foil) holds the paste while it sets; it is not represented"}
          - {kind: ingredient, note: "black-eyed beans are not catalogued"}
          - {kind: evidence, note: "'tomato makes it difficult to solidify' (A19a) is recorded as evidence only"}
