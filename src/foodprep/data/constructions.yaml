        result: coated
        final: {state: {cooked: true, coated: true}, recipes: [M4a]}
        gaps:
          - {kind: ingredient, note: "feta, self-raising flour and cornmeal are not catalogued"}
      pan_fried:
        recipes: [M4b]
        patterns: [C4]
        holds_by: [H6a, H5b, H9]
        water: [W2, W6]
        why: >
          Squeezed (not salted) courgette with much cheese, egg and
          self-raising flour, rested 30 min, spooned into a little olive oil at
          moderate heat so they stay fluffy and fairly dry.
        materials:
          courgette:
            from: courgette.fruit
            recipes: [M4b]
            steps:
              - raper
              - {op: presser, keep: pulp, discard: [juice], evidence: "excess water squeezed out; no salting stated"}
        assemblies:
          mass:
            op: melanger
            recipes: [M4b]
            roles: {body: courgette, coagulant: eggs, dry_phase: self_raising_flour, flavour: [hard_cheese, feta, spring_onion, herbs]}
            steps:
              - {op: reposer, evidence: "30 min"}
              - {op: faconner, evidence: "spooned"}
              - {op: rissoler, evidence: "heavy pan, olive oil covering the base, medium heat; little oil and low heat keep them fluffy and fairly dry; too hot and they do not cook through (M4b)"}
        result: mass
        final: {state: {cooked: true, browned: true}, recipes: [M4b]}

  chawanmushi:
    name: Chawanmushi
    tradition: Japan, Japanese source
    split: held_out
    routes:
      steamed_custard:
        recipes: [A8a]
        patterns: [C6]
        holds_by: [H5a]
        why: >
          Egg diluted with about three times its volume of cooled dashi sets
