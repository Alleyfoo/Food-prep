          - {kind: model, note: "starch dusted inside the pocket as glue has no role in farcir"}
          - {kind: scope, note: "pork filling"}
      double_fried:
        recipes: [A12b]
        patterns: [C7, C9]
        holds_by: [H7, H9]
        why: >
          Salted, dried aubergine pockets hold a pork filling stirred until
