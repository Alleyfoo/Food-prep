# Documented constructions (R3, docs/adr/0003-documented-constructions.md).
#
# Real dishes, from raw parts to their finished structure, recorded so that
# foodprep.constructions can check them against the operation model. This is
# not a recipe collection: a dish is the materials it is built from, the R1
# operations that make each one, the relations that join them, and the claims
# about why it holds, each with the R2 recipe ids it rests on
# (docs/research/r2-construction-patterns/recipes.md; URLs in sources.md).
# Quantities and conditions are `evidence` for a step or relation, never a
# step to follow.
#
# Dish:     name, tradition, split (design | held_out), routes, note
# Route:    recipes, patterns, holds_by, water, why, materials, assemblies,
#           result, final {state, recipes, evidence}, gaps [{kind, note}], note
# Material: from (ingredient.part, or {material, step, output}), steps,
#           recipes, water, note
# Step:     an operation id, or {op, keep, or, discard, recipes, evidence,
#           expects, optional, note}; keep = the output followed; discard =
#           outputs thrown away; or = documented alternative operations
# Assembly: op (an assembly operation), roles {role: [members]}, state +
#           because (a change the members cause), expects, steps, recipes,
#           holds_by, water, evidence, note
# Member:   an id (material, assembly or addition), or {use, recipes, note,
#           water, optional, prep}
# Expect:   {state, member (of an assembly), because, recipes}: what documented
#           practice requires at that point; checked against the computed state
# Gap kinds: model (the model cannot express or check it), scope (outside the
#           vegetable scope), ingredient (not in the catalogue), evidence

patterns:
  C1: released-starch cake
  C2: cooked-starch mass
  C3: raw pulse paste
  C4: bound watery vegetable
  C5: batter matrix with inclusions
  C6: egg-set matrix
  C7: container and filling
  C8: layered assembly
  C9: coated piece

# R2 mechanisms.md section 2
mechanisms:
  H1: starch released from a raw tuber, gelatinised by the pan
  H2: starch already gelatinised, firmed by cooling
  H3: raw starch partly gelatinised by scalding
  H4: raw soaked pulses ground to a paste that sets on heating
  H5a: egg coagulating as the continuous phase
  H5b: egg coagulating as a minority addition to a vegetable mass
  H5c: egg as glue between a piece and its dry coating
  H5d: egg as an aerated foam coat
  H6a: a small dry phase takes up the water left in a vegetable mass
  H6a_own_juice: the vegetable's own salt-drawn juice is the only liquid for the flour
  H6b: a liquid batter as the matrix, the vegetable as inclusion
  H7: containment by a shell, leaf, dough or temporary support
  H8: packing, weight and rest hold the structure from outside
  H9: a crust as a structural shell
  H10: a thickened liquid holds layers
  H11: air held in a paste or egg

# R2 mechanisms.md section 3
water_routes:
  W1: salt, rest, then squeeze or drain
  W2: squeeze or press without salting
  W3: drain by gravity or weight
  W4: settle the expressed liquid and return its starch
  W5: drive the water off with heat before combining
  W6: absorb it with a dry addition and let it swell
  W7: prevent its release (salt late, grate just before cooking)
  W8: use it (as batter liquid, or the cooking liquid of raw rice)
  W9: dry the surface before coating

# Ingredients used as they are. `catalogue` names the tomato.yaml ingredient;
# null means it is not in the catalogue (a Lidl gap, not checked this round);
