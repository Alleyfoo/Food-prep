          strained so the custard is smooth. Strong heat only until the cups
          warm, then low.
        assemblies:
          custard:
            op: melanger
            recipes: [A8a]
            roles:
              body: {use: eggs, prep: "beaten gently without foaming"}
              liquid: {use: dashi, note: "cooled; about 3 times the egg volume"}
              flavour: [mirin, soy_sauce, salt]
            state: {water: very_high}
            because: [dashi]
            steps:
              - {op: filtrer, evidence: "strained through a tea strainer to remove unevenness and bubbles"}
          cups:
            op: incorporer
            recipes: [A8a]
            roles: {matrix: custard, inclusion: [chicken, shiitake, kamaboko]}
            expects:
              - member: custard
                state: {aerated: false, clear: true}
                because: "beaten without foaming, bubbles strained out (A8a)"
                recipes: [A8a]
            steps:
              - {op: cuire_vapeur, evidence: "a dry cloth under the lid; high heat 1-2 min until the cups warm, then low 15-20 min; done when a skewer brings up clear liquid"}
        result: cups
        final: {state: {cooked: true}, recipes: [A8a]}
        gaps:
