          - {kind: scope, note: "chicken, kamaboko"}
          - {kind: ingredient, note: "dashi, mirin, shiitake are not catalogued"}

  farcis_nicois:
    name: Petits farcis niçois
    tradition: Nice, France; French sources
    split: held_out
    routes:
      meat_baked:
        recipes: [M16a]
        patterns: [C7]
        holds_by: [H7]
        water: [W5]
        why: >
          Courgettes, onions and aubergines are boiled, halved and hollowed;
          all the scooped flesh is browned and goes back into a filling held by
          bread soaked in milk, Parmesan and an egg. The shells hold it through
          a gentle bake that keeps the vegetables' juice.
        materials:
          courgette:
            from: courgette.fruit
            recipes: [M16a]
            steps:
              - {op: blanchir, evidence: "boiled 10 min in salted water"}
              - {op: fendre, evidence: "halved"}
              - {op: creuser, keep: shell, evidence: "flesh scooped"}
          flesh:
            from: {material: courgette, step: creuser, output: flesh}
            recipes: [M16a]
            steps: [hacher, {op: sauter, evidence: "added to the browned onion flesh and garlic; off the heat"}]
          onion:
            from: onion.bulb
            recipes: [M16a]
            note: "the onion halves are vessels too; an assembly has one container, so only the courgette is shown"
            steps:
              - eplucher
              - {op: blanchir, evidence: "boiled 10 min"}
              - fendre
              - {op: creuser, keep: flesh, evidence: "flesh scooped"}
              - hacher
              - {op: sauter, evidence: "browned lightly with garlic"}
          bread:
            from: bread.crumb
            recipes: [M16a]
            steps:
              - {op: tremper, evidence: "50 g bread soaked in milk"}
        assemblies:
          filling:
            op: melanger
            recipes: [M16a]
            roles:
              body: flesh
              dry_phase: bread
              coagulant: eggs
              flavour: [onion, garlic, minced_meat, ham, parmesan, herbs]
          stuffed:
            op: farcir
            recipes: [M16a]
            roles: {container: courgette, filling: filling}
            steps:
              - {op: cuire_four, evidence: "breadcrumbs on top; at least 30 min until gratinéed; historically in the baker's oven at gentle heat so the vegetables kept their juice"}
        result: stuffed
        final: {state: {cooked: true, hollow: true, filled: true}, recipes: [M16a]}
        gaps:
          - {kind: model, note: "several vessels (courgette, onion, aubergine, tomato, pepper) share one filling: an assembly has one container"}
          - {kind: scope, note: "veal and ham"}
          - {kind: ingredient, note: "aubergine and peppers are not catalogued"}
      vegetarian:
        recipes: [M16b]
        patterns: [C7]
        holds_by: [H7]
        why: >
