              - {op: presser, keep: pulp, discard: [juice], evidence: "squeezed very well"}
          onion:
            from: onion.bulb
            recipes: [M4a]
            steps: [eplucher, hacher]
        assemblies:
          mass:
            op: melanger
            recipes: [M4a]
            roles: {body: courgette, coagulant: eggs, dry_phase: self_raising_flour, flavour: [feta, onion, spring_onion, herbs, spices]}
            evidence: "flour mixed in 2-3 times only; it is there to absorb the remaining liquid (M4a)"
            expects:
              - member: courgette
                state: {water: "<=medium"}
