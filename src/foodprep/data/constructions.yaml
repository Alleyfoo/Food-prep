  pierogi_ruskie:
    name: Pierogi ruskie / vareniki with potato
    tradition: Poland and Russia; Polish and Russian sources
    split: held_out
    routes:
      ruskie:
        recipes: [E16a]
        patterns: [C7, C2]
        holds_by: [H2, H7]
        why: >
          A cooled riced potato and curd-cheese filling, no egg, holds by its
          dry components; a thin oil-and-hot-water dough wraps it and survives
          boiling because of the oil.
        materials:
          potato:
            from: potato.tuber
            recipes: [E16a]
            steps:
              - eplucher
              - {op: cuire_anglaise, evidence: "boiled in salted water"}
              - {op: refroidir, evidence: "cooled (no reason given)"}
              - {op: ecraser, evidence: "pressed through a ricer"}
          onion:
            from: onion.bulb
            recipes: [E16a]
            steps:
              - eplucher
              - hacher
              - {op: sauter, evidence: "fried golden in butter with a pinch of salt and a little sugar"}
              - {op: refroidir, evidence: "cooled"}
        assemblies:
          filling:
            op: melanger
            recipes: [E16a]
            roles: {body: potato, flavour: [onion, curd_cheese, spices]}
            note: "mixed until it holds; no egg"
          dough:
            op: melanger
            recipes: [E16a]
            roles: {body: wheat_flour, liquid: water, fat: [vegetable_oil, olive_oil], flavour: salt}
            state: {flexible: true, piece: large, thin: true}
            because: [water, vegetable_oil]
            evidence: "half a cup of hot (not boiling) water; kept covered and warm; rolled to 1.5-2 mm; the oil means even thin dough 'nie rozklei się podczas gotowania'"
          pierogi:
            op: envelopper
            recipes: [E16a]
            roles: {wrapper: dough, filling: filling}
            evidence: "cut with a glass, about ½ tsp filling each, sealed with fingers then a fork"
            expects:
              - member: filling
                state: {cooled: true}
                because: "the filling is cooled before filling (E16a gives no reason)"
                recipes: [E16a]
            steps:
              - {op: cuire_anglaise, evidence: "into hot salted water; 2-3 min after they float"}
        result: pierogi
        final: {state: {cooked: true, wrapped: true}, recipes: [E16a]}
        gaps:
          - {kind: model, note: "a dough is an assembly of additions whose rolled, flexible state is asserted: rolling (abaisser) has no outputs, and doughs are not modelled"}
          - {kind: model, note: "sealing the edges is not an operation"}
          - {kind: ingredient, note: "flour and curd cheese are not catalogued"}
      vareniki:
        recipes: [E16b]
        patterns: [C7, C2]
        holds_by: [H2, H7]
        why: >
          A mashed potato filling used cold, in an elastic dough made with
          boiling water and egg; boiled briefly and lifted out at once, since
          overcooked they lose shape. Starch in the cooking water helps.
        materials:
          potato:
            from: potato.tuber
            recipes: [E16b]
            steps:
              - eplucher
              - cuire_anglaise
              - {op: ecraser, evidence: "mashed with a little cooking water or hot milk, butter and salt"}
          onion:
            from: onion.bulb
            recipes: [E16b]
            steps: [eplucher, hacher, {op: sauter, evidence: "fried golden"}]
        assemblies:
          filling:
            op: melanger
            recipes: [E16b]
            roles: {body: potato, liquid: {use: milk, optional: true}, fat: butter, flavour: [onion, salt]}
            steps:
              - {op: refroidir, evidence: "used cooled ('остывшей')"}
          dough:
            op: melanger
            recipes: [E16b]
            roles: {body: wheat_flour, liquid: water, coagulant: eggs, fat: vegetable_oil, flavour: salt}
            state: {flexible: true, piece: large, thin: true}
            because: [water, eggs]
            evidence: "400 g flour, 160 ml boiling water (makes it elastic), 1 egg, 2 tbsp oil; salt in the dough keeps them from falling apart"
            steps:
              - {op: reposer, evidence: "40 min under a towel"}
          vareniki:
            op: envelopper
            recipes: [E16b]
            roles: {wrapper: dough, filling: filling}
            evidence: "edges brushed with egg white before sealing"
            steps:
              - {op: cuire_anglaise, evidence: "5-7 min after floating, lifted out promptly: overcooked they lose shape and turn sticky; optional rice in the water, whose starch stops them falling apart"}
        result: vareniki
        final: {state: {cooked: true, wrapped: true}, recipes: [E16b]}
        gaps:
          - {kind: model, note: "the dough's state is asserted (rolling has no outputs; scalding with boiling water, R2 H3, is not an operation)"}
          - {kind: model, note: "starch put into the cooking water is not a property of the cooking step"}

  spanakopita:
    name: Spanakopita / ıspanaklı börek
    tradition: Greece and Turkey; Greek and Turkish sources
    split: held_out
    routes:
      salted_spinach:
        recipes: [M8a]
        patterns: [C8, C4]
        holds_by: [H5b, H7]
        water: [W1]
        why: >
          Spinach is salted and squeezed so the filling is not soggy; egg and
          feta hold it between two sheets of a homemade dough brushed with fat.
        materials:
          spinach:
            from: spinach.leaves
            recipes: [M8a]
            water: [W1]
            steps:
              - {op: hacher, evidence: "1 kg chopped fine"}
              - {op: degorger, keep: drained, discard: [vegetable_water], evidence: "rubbed with a little salt, drained and squeezed well: removing the water prevents a soggy filling"}
        assemblies:
          filling:
            op: melanger
            recipes: [M8a]
            roles: {body: spinach, coagulant: eggs, fat: olive_oil, flavour: [feta, herbs, spring_onion]}
          dough:
            op: melanger
            recipes: [M8a]
            roles: {body: wheat_flour, liquid: water, fat: olive_oil}
            state: {flexible: true, piece: large, thin: true}
            because: [water, olive_oil]
            evidence: "homemade, rolled, brushed with melted fat, folded"
            steps:
              - {op: reposer, evidence: "chilled 10 min"}
          pie:
            op: superposer
            recipes: [M8a]
            roles: {layer: [dough, dough], binding: filling}
            evidence: "the filling between two sheets"
            steps:
              - {op: cuire_four, evidence: "180 C about 30 min"}
        result: pie
        final: {state: {cooked: true, layered: true}, recipes: [M8a]}
        gaps:
          - {kind: model, note: "the dough's rolled, flexible state is asserted; rolling (abaisser) has no outputs"}
          - {kind: ingredient, note: "spinach, feta and flour are not catalogued"}
      raw_spinach:
        recipes: [M8b]
        patterns: [C8]
        holds_by: [H10, H5a]
        water: [W8]
        why: >
          The raw spinach keeps its water, so the yufka sheets are wetted less
          with the milk, oil and egg sauce: the water is managed in the pastry,
          not removed from the vegetable. The egg is in the sauce between the
          sheets, not in the filling.
        materials:
          spinach:
            from: spinach.leaves
            recipes: [M8b]
            steps:
              - {op: hacher, evidence: "chopped, washed in vinegared water, drained completely; raw, not salted or squeezed"}
          onion:
            from: onion.bulb
            recipes: [M8b]
            steps: [eplucher, hacher]
        assemblies:
          filling:
            op: melanger
            recipes: [M8b]
            roles: {body: spinach, flavour: [onion, white_cheese, salt, spices]}
            note: "no egg in the filling"
            expects:
              - member: spinach
                state: {salted: false, water: very_high}
                because: "do not over-wet the yufka: the raw spinach brings its own moisture (M8b)"
                recipes: [M8b]
          sauce:
            op: melanger
            recipes: [M8b]
            roles: {body: milk, fat: vegetable_oil, coagulant: eggs}
            state: {sets_on_heat: true}
            because: [eggs]
          borek:
            op: superposer
            recipes: [M8b]
            roles: {layer: [yufka, yufka, yufka], binding: [sauce, filling]}
            evidence: "sheets crumpled rather than laid taut; filling in the middle"
            steps:
              - {op: cuire_four, evidence: "180 C about 40 min; the first 20 min it steams in the oven"}
              - {op: reposer, evidence: "rested under a damp towel"}
        result: borek
        final: {state: {cooked: true, layered: true}, recipes: [M8b]}
        gaps:
          - {kind: model, note: "washing (in vinegared water) is not an operation, as with rinsing in A1b"}
          - {kind: ingredient, note: "yufka, spinach, white cheese and milk are not catalogued"}

  zha_qie_he:
    name: Zha qie he (fried stuffed aubergine boxes)
    tradition: China; Chinese source and an English second witness
    split: held_out
    routes:
      egg_starch_coat:
        recipes: [A12a]
        patterns: [C7, C9]
        holds_by: [H7, H5c, H9]
        why: >
          Pairs of aubergine slices joined at one edge make a pocket; starch
          dusted inside fixes the meat filling, and an egg-then-starch coat
          fried at moderate heat closes the box.
        materials:
          aubergine:
            from: aubergine.fruit
            recipes: [A12a]
            steps:
              - {op: emincer, evidence: "cut into pairs of slices joined at one edge (连刀)"}
        assemblies:
          filling:
            op: melanger
            recipes: [A12a]
            roles: {body: minced_meat, starch: cornflour, liquid: water, flavour: [spring_onion, spices]}
            note: "stirred clockwise"
          box:
            op: farcir
            recipes: [A12a]
            roles: {container: aubergine, filling: filling}
            evidence: "starch dusted inside each pocket fixes the filling so it does not fall out ('更好固定肉馅，不易脱落')"
          coated:
            op: revetir
            recipes: [A12a]
            roles: {piece: box, coat: [eggs, cornflour]}
