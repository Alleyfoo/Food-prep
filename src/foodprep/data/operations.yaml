# Culinary operations: one reusable definition per operation, independent of
# any ingredient. Replaces technique_rules.yaml (Culinary Operations R1,
# docs/research/r1-culinary-operations/model-design.md).
#
# Read by foodprep.operations (applicability, outputs, bounded sequences) and
# by foodprep.possibilities (the family generator uses the operations marked
# family_state, under their generator_id, exactly as before).
#
# Fields
#   fr, en, aliases      names; the id is the French name in ASCII
#   categories           geometry | separation | extraction | mechanical |
#                        thermal | chemical (several when several apply)
#   technique            the tomato.yaml technique this operation is, if any
#   preparation          the vocabularies.yaml `preparations` id a cut produces
#   requires             property: [test, why] or [test, why, waived_when]
#                        (waived_when: one condition, or a list of which any may hold).
#                        Tests: true/false, "x", ">=x", "<=x", "a|b" (any of).
#                        A property the material does not state is UNKNOWN,
#                        never false (except `recorded_only_when_true` below).
#   conditional          [{when, note}]: applicable only if the note is followed
#   unsafe_when          [{when, note}]: never generated
#   except               ingredient.part a cook would not do this to
#   adds                 ingredients the operation brings (makes a composite)
#   equipment, effort    effort 1 (minutes) .. 3 (long or skilled)
#   parameters, mechanisms, changes, applications, limitations, safety
#   outputs              [{name, kind, from, set, raise, lower, add_flavour,
#                        when_set, terminal}]; kind: geometry | state | fraction;
#                        from: self (default) | outer_layer | seed_core;
#                        terminal: the output is exhausted (spent solids) and
#                        no sequence continues from it
#   established_on       ingredient.part where this operation is documented
#   evidence             source ids (docs/research/r1-culinary-operations/sources.md)
#   confidence           established (the operation is documented)
#   generator            false when the bounded generator never takes it, with why
#   family_state         true for the states the family generator pairs with
#                        families; generator_id, effects, corpus and does are its
#                        fields (formerly technique_rules.yaml)

# The family generator's states, in the order it lists them (the order of the
# former technique_rules.yaml). Each is the generator_id of a family_state
# operation.
family_states: [raw, massage, steam, roast, stir_fry, fry, braise, simmer, dry, puree]

scales:
  levels: [none, low, medium, high, very_high]
  piece: [powder, fine, small, medium, large, whole]

# Flags part_properties.yaml records only when true, and state flags that only
# an operation can set. A raw part without them really does not have them.
recorded_only_when_true: [thin, leafy, liquid, browns_when_cut, crisp, smooth, cooked,
                          blanched, concentrated, browned, infused, gelled, pickled,
                          fermented, binder, coated, hollow, emulsified, thickened,
                          usually_discarded, salted, clear, glazed, smoked, scored, cut,
                          # structures recorded only where they exist
                          has_outer_layer, has_seed_core, has_stone, podded, zestable,
                          segmented, has_kernels, skin_slips_when_blanched, heat_sensitive]

ordinary_equipment: [knife, peeler, grater, pot, pan, oven, sieve, bowl, colander,
                     baking_tray, whisk, towel, jar, cloth, ladle, blender, spoon, fork]

# tomato.yaml techniques no operation stands for, and why.
unlinked_techniques:
  dice: "generic; brunoise, macedoine and paysanne are its classical forms"
  salsa: "a dish, not an operation"
  soup: "a dish, not an operation"
  salad: "a dish, not an operation"
  hash: "a dish, not an operation"
  smash_roast: "a sequence: boil, crush, roast"
  brown: "acts on butter's milk solids; beurre noisette, outside the vegetable set"
  raw_slaw: "a dish, not an operation"

operations:

  # ======================= geometry and cutting ==========================
  julienne:
    fr: julienne
    en: julienne (matchsticks)
    aliases: [allumette, matchstick]
    categories: [geometry]
    preparation: julienne
    requires:
      shape: ["cylindrical|round|irregular", "a solid body to square off; not branched, leafy or feathery"]
      cut: [false, "already cut: one cut per sequence"]
      firmness: [">=medium", "firm enough to hold a narrow strip"]
      liquid: [false, "a liquid cannot be cut"]
      piece: [">=medium", "starts larger than a matchstick"]
    conditional:
      - when: {has_outer_layer: true, outer_layer_toughness: ">=high"}
        note: "peel first: the outer layer is too tough to cut fine"
    equipment: [knife]
    effort: 2
    parameters: "about 3 x 3 mm x 4-6 cm; fine julienne 1.5 mm; Escoffier longer"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: small, shape: strips, thin: true}}
    changes: "Far more surface: cooks in seconds, takes dressing, stays crisp raw"
    applications: "slaws, garnish, stir-fries, consomme garnish"
    limitations: "soft or leafy materials tear instead of cutting clean"
    established_on: [carrot.root, broccoli.stems, courgette.fruit]
    evidence: [escoffier, cia, wiki_knife_cuts]
    confidence: established

  brunoise:
    fr: brunoise
    en: brunoise (fine dice)
    categories: [geometry]
    preparation: brunoise
    requires:
      shape: ["cylindrical|round|irregular", "a solid body to square off; not branched, leafy or feathery"]
      cut: [false, "already cut: one cut per sequence (brunoise refines julienne)", {form: julienne}]
      firmness: [">=medium", "holds a 3 mm cube"]
      liquid: [false, "a liquid cannot be cut"]
      piece: ["small|medium|large|whole", "cut from julienne or a larger piece"]
    conditional:
      - when: {has_outer_layer: true, outer_layer_toughness: ">=high"}
        note: "peel first: tough skin breaks a 3 mm cube"
    equipment: [knife]
    effort: 2
    parameters: "about 3 mm cubes (fine brunoise 1.5 mm), cut across julienne"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: fine, shape: cubes}}
    changes: "Disperses through a sauce or garnish; softens almost at once"
    applications: "garnish, sauce bases, mirepoix-like seasoning"
    limitations: "only firm materials; watery ones bleed"
    established_on: [carrot.root, courgette.fruit]
    evidence: [escoffier, cia, wiki_knife_cuts]
    confidence: established

  batonnet:
    fr: bâtonnet
    en: baton
    aliases: [baton]
    categories: [geometry]
    preparation: batonnet
    requires:
      shape: ["cylindrical|round|irregular", "a solid body to square off; not branched, leafy or feathery"]
      cut: [false, "already cut: one cut per sequence"]
      firmness: [">=medium", "holds a stick shape"]
      liquid: [false, "a liquid cannot be cut"]
      piece: [">=medium", "starts larger than a stick"]
    equipment: [knife]
    effort: 2
    parameters: "about 6 x 6 mm x 5-6 cm; sources disagree (some 1 cm thick)"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: small, shape: sticks}}
    changes: "Even sticks that cook evenly; enough mass to stay tender inside"
    applications: "crudites, fries, glazed vegetables"
    limitations: "needs a long enough piece"
    established_on: [carrot.root, courgette.fruit]
    evidence: [cia, wiki_knife_cuts]
    confidence: established

  macedoine:
    fr: macédoine
    en: small dice
    categories: [geometry]
    preparation: macedoine
    requires:
      shape: ["cylindrical|round|irregular", "a solid body to square off; not branched, leafy or feathery"]
      cut: [false, "already cut: one cut per sequence"]
      firmness: [">=medium", "holds a cube"]
      liquid: [false, "a liquid cannot be cut"]
      piece: [">=medium", "starts larger than a cube"]
    equipment: [knife]
    effort: 2
    parameters: "about 5 mm cubes (one source 4 mm)"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: small, shape: cubes}}
    changes: "Bite-size cubes; even cooking"
    applications: "vegetable salads (macedoine), soups, fillings"
    established_on: [carrot.root, courgette.fruit]
    evidence: [escoffier, wiki_knife_cuts]
    confidence: established

  paysanne:
    fr: paysanne
    en: paysanne (thin flat pieces)
    categories: [geometry]
    preparation: paysanne
    requires:
      shape: ["cylindrical|round|irregular", "a solid body to square off; not branched, leafy or feathery"]
      cut: [false, "already cut: one cut per sequence"]
      firmness: [">=medium", "holds a thin flat piece"]
      liquid: [false, "a liquid cannot be cut"]
      piece: [">=medium", "starts larger than the piece"]
    equipment: [knife]
    effort: 2
    parameters: "about 12 x 12 x 3 mm; square, round or triangular by source"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: small, shape: flat, thin: true}}
    changes: "Thin and flat: quick, even cooking in soups"
    applications: "rustic soups (potage paysanne)"
    established_on: [carrot.root]
    evidence: [escoffier, wiki_knife_cuts]
    confidence: established

  chiffonade:
    fr: chiffonnade
    en: chiffonade (fine ribbons of leaves)
    categories: [geometry]
    preparation: chiffonade
    requires:
      cut: [false, "already cut: one cut per sequence"]
      leafy: [true, "needs a leaf"]
      shape: ["flat", "the leaf must be a continuous sheet that can be rolled"]
      flexible: [true, "rolled before slicing"]
    equipment: [knife]
    effort: 1
    parameters: "leaves stacked, rolled and cut 1-3 mm across"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: fine, shape: ribbons, thin: true}}
    changes: "Fine ribbons that wilt instantly in heat"
    applications: "garnish, soups, quick sautes of greens"
    limitations: "feathery or tiny leaves cannot be rolled; chop them instead"
    established_on: [broccoli.leaves]
    evidence: [cia, wiki_knife_cuts]
    confidence: established

  tourner:
    fr: tourner (légumes tournés)
    en: tourne (turned)
    categories: [geometry]
    preparation: tourne
    requires:
      cut: [false, "already cut: one cut per sequence"]
      firmness: [">=high", "carved with a paring knife into a seven-sided barrel"]
      shape: ["cylindrical|round", "needs a solid body to carve"]
      piece: [">=medium", "starts larger than the barrel"]
    equipment: [knife]
    effort: 3
    parameters: "about 5 cm long, 7 faces, 2 cm wide"
    mechanisms: [shape_uniformity]
    outputs:
      - {kind: geometry, set: {cut: true, piece: medium, shape: barrels}}
      - {name: trimmings, kind: fraction, set: {piece: small, shape: irregular, usually_discarded: true}}
    changes: "Identical pieces that cook evenly and glaze well; leaves many trimmings"
    applications: "classical garnish, glazed carrots"
    limitations: "wasteful; skill-heavy"
    established_on: [carrot.root]
    evidence: [escoffier, cia, wiki_knife_cuts]
    confidence: established

  rondelles:
    fr: rondelles
    en: rounds (coins)
    categories: [geometry]
    preparation: rondelles
    requires:
      cut: [false, "already cut: one cut per sequence"]
      shape: ["cylindrical", "a round cross-section"]
      firmness: [">=medium", "holds a disc"]
    equipment: [knife]
    effort: 1
    parameters: "2-10 mm discs across a cylinder"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: small, shape: discs}}
    changes: "Discs that stay juicy; thin slices are emincer"
    applications: "sautes, chips (thin), steaming"
    established_on: [carrot.root, courgette.fruit, broccoli.stems]
    evidence: [cia]
    confidence: established

  emincer:
    fr: émincer
    en: slice thinly
    categories: [geometry]
    technique: slice
    preparation: sliced
    requires:
      cut: [false, "already cut: one cut per sequence"]
      firmness: [">=low", "holds a slice"]
      liquid: [false, "a liquid cannot be cut"]
    equipment: [knife]
    effort: 1
    parameters: "thin slices, 1-3 mm"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: small, shape: flat, thin: true}}
    changes: "Thin slices that cook fast and brown at the edges"
    applications: "sautes, stir-fries, carpaccio-style salads"
    established_on: [broccoli.stems, courgette.fruit, carrot.root]
    evidence: [cia, larousse]
    confidence: established

  hacher:
    fr: hacher
    en: chop
    categories: [geometry]
    preparation: chopped
    requires:
      cut: [false, "already cut: one cut per sequence"]
      liquid: [false, "a liquid cannot be chopped"]
    equipment: [knife]
    effort: 1
    parameters: "irregular pieces, coarse to fine"
    mechanisms: [surface_area_increase, cell_rupture]
    outputs:
      - {kind: geometry, set: {cut: true, piece: fine, shape: irregular}}
    changes: "Irregular fine pieces; releases juice and aroma"
    applications: "herb pastes, salsas, fillings"
    established_on: [carrot.greens, broccoli.leaves]
    evidence: [cia, larousse]
    confidence: established

  ciseler:
    fr: ciseler
    en: finely mince (shallots, herbs)
    categories: [geometry]
    preparation: finely_chopped
    requires:
      cut: [false, "already cut: one cut per sequence"]
      leafy: [true, "herbs and leaves are sliced fine without bruising"]
    equipment: [knife]
    effort: 1
    parameters: "very fine, clean cuts that do not bruise"
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {cut: true, piece: fine, shape: irregular}}
    changes: "Fine pieces that stay fresh instead of bruised and dark"
    applications: "herb garnish, sauces"
    limitations: "classically for shallots and herbs; alliums are outside this set"
    established_on: [carrot.greens]
    evidence: [larousse, cia]
    confidence: established

  concasser:
    fr: concasser
    en: rough-chop (concassé)
    categories: [geometry]
    technique: crush
    preparation: crushed
    requires:
      cut: [false, "already cut: one cut per sequence"]
      firmness: ["<=medium", "classically soft flesh (tomato) or brittle seeds"]
      liquid: [false, "a liquid cannot be chopped"]
    equipment: [knife]
    effort: 1
    parameters: "rough pieces about 5-10 mm"
    mechanisms: [cell_rupture]
    outputs:
      - {kind: geometry, set: {cut: true, piece: small, shape: irregular}}
    changes: "Rough pieces; for tomato, peeled and seeded flesh that holds its shape"
    applications: "tomato concasse, sauces"
    established_on: [tomato.flesh]
    evidence: [escoffier, larousse]
    confidence: established

  raper:
    fr: râper
    en: grate
    categories: [geometry, mechanical]
    technique: grate
    preparation: grated
    requires:
      cut: [false, "already cut: one cut per sequence"]
      firmness: [">=medium", "must resist the grater"]
      liquid: [false, "a liquid cannot be grated"]
    conditional:
      - when: {has_outer_layer: true, outer_layer_toughness: ">=high"}
        note: "peel first: the tough layer shreds into strings"
    equipment: [grater]
    effort: 1
    parameters: "coarse or fine grater"
    mechanisms: [surface_area_increase, cell_rupture]
    outputs:
      - {kind: geometry, set: {cut: true, piece: fine, shape: shreds}}
    changes: "Shreds that release juice; watery materials weep"
    applications: "slaws, fritters, cakes"
    established_on: [carrot.root, courgette.fruit]
    evidence: [cia]
    confidence: established

  rubans:
    fr: tailler en rubans
    en: ribbons
    aliases: [spiralise]
    categories: [geometry]
    preparation: ribbons
    requires:
      cut: [false, "already cut: one cut per sequence"]
      sheetable: [true, "must give long continuous strips without breaking"]
      firmness: [">=medium", "a peeler or spiraliser needs resistance"]
    conditional:
      - when: {has_outer_layer: true, outer_layer_toughness: ">=high"}
        note: "peel first: ribbons with a tough edge stay stringy"
    equipment: [peeler]
    effort: 1
    parameters: "peeler or mandoline ribbons 1-2 mm thick; spiraliser for noodles"
    mechanisms: [shape_transformation]
    outputs:
      - {kind: geometry, set: {cut: true, piece: medium, shape: ribbons, thin: true, flexible: true}}
    changes: "Long flexible ribbons: eaten raw, blanched, or as noodles"
    applications: "vegetable noodles, salads, wraps"
    established_on: [courgette.fruit, carrot.root, broccoli.stems]
    evidence: [cia, web_b1, web_c3, web_z4]
    confidence: established

  quartiers:
    fr: tailler en quartiers
    en: wedges
    categories: [geometry]
    preparation: wedges
    requires:
      cut: [false, "already cut: one cut per sequence"]
      shape: ["round|cylindrical", "a body to cut lengthwise into wedges"]
      piece: [">=medium", "starts larger than a wedge"]
      liquid: [false, "a liquid cannot be cut"]
    equipment: [knife]
    effort: 1
    mechanisms: [shape_transformation]
    outputs:
      - {kind: geometry, set: {cut: true, piece: medium, shape: wedges}}
    changes: "Large pieces with a cut face to brown and a skin side to hold"
    applications: "roasting, grilling"
    established_on: [avocado.flesh, courgette.fruit]
    evidence: [cia]
    confidence: established

  troncons:
    fr: tailler en tronçons
    en: chunks (sections)
    categories: [geometry]
    preparation: troncons
    requires:
      cut: [false, "already cut: one cut per sequence"]
      shape: ["cylindrical", "an elongated body to cut across"]
      piece: [">=large", "starts long"]
    equipment: [knife]
    effort: 1
    mechanisms: [shape_transformation]
    outputs:
      - {kind: geometry, set: {cut: true, piece: medium, shape: sections}}
    changes: "Thick sections for long cooking or stuffing"
    applications: "braises, stuffed sections"
    established_on: [carrot.root, courgette.fruit]
    evidence: [larousse]
    confidence: established

  inciser:
    fr: inciser (ciseler la surface)
    en: score
    categories: [geometry]
    preparation: scored
    generator: false
    not_generated_because: "changes little on its own; a detail of grilling or roasting halves"
    requires:
      piece: [">=medium", "a surface to score"]
      firmness: [">=low", "holds a shallow cut"]
    equipment: [knife]
    effort: 1
    mechanisms: [surface_area_increase]
    outputs:
      - {kind: geometry, set: {scored: true}}
    changes: "Shallow cuts let heat and seasoning in; cut faces brown"
    applications: "grilled avocado, roasted halves"
    limitations: "changes little on its own"
    established_on: [avocado.flesh]
    evidence: [larousse]
    confidence: established

  detailler_bouquets:
    fr: détailler en bouquets
    en: cut into florets
    categories: [geometry, separation]
    requires:
      cut: [false, "already cut: one cut per sequence"]
      shape: ["tree", "a branched head"]
    equipment: [knife]
    effort: 1
    mechanisms: [shape_transformation]
    outputs:
      - {kind: geometry, set: {cut: true, piece: small}}
    changes: "Small florets that cook evenly"
    applications: "steaming, roasting, stir-frying"
    established_on: [broccoli.florets]
    evidence: [cia]
    confidence: established

  # ======================= separation ======================================
  eplucher:
    fr: éplucher
    en: peel (with a peeler or knife)
    categories: [separation]
    technique: peel
    requires:
      has_outer_layer: [true, "needs an outer layer that is not a part of its own"]
      firmness: [">=medium", "a peeler needs a firm body"]
      cut: [false, "peel before cutting, not each piece after"]
      cooked: [false, "a peeler works on raw produce; skin cooked produce with peler"]
    equipment: [peeler]
    effort: 1
    mechanisms: [layer_separation]
    outputs:
      - {name: inner, kind: state, from: self, set: {has_outer_layer: false}}
      - {name: peel, kind: fraction, from: outer_layer}
    changes: "Two materials: the peeled body (often more tender) and the peel"
    applications: "broccoli stems before slicing, carrots for a smooth finish"
    limitations: "a peel is only a residue if nothing is done with it"
    established_on: [broccoli.stems, carrot.root]
    evidence: [cia, pepin]
    confidence: established

  peler:
    fr: peler
    en: skin (after cooking or blanching)
    categories: [separation]
    requires:
      has_outer_layer: [true, "needs a skin"]
      cooked: [true, "the skin slips off only after heat"]
    equipment: [knife]
    effort: 1
    mechanisms: [layer_separation]
    outputs:
      - {name: inner, kind: state, from: self, set: {has_outer_layer: false}}
      - {name: skin, kind: fraction, from: outer_layer, set: {cooked: true}}
    changes: "Removes a skin loosened by heat"
    applications: "roasted peppers, beetroot, cooked carrots"
    evidence: [larousse]
    confidence: established

  monder:
    fr: monder
    en: blanch and skin
    categories: [separation, thermal]
    requires:
      skin_slips_when_blanched: [true, "a skin that loosens after seconds in boiling water"]
    equipment: [pot]
    effort: 1
    parameters: "10-30 s in boiling water, then iced"
    mechanisms: [layer_separation]
    outputs:
      - {name: inner, kind: state, set: {has_outer_layer: false}}
      - {name: skin, kind: fraction, from: outer_layer}
    changes: "Clean skinning without cooking the flesh"
    applications: "tomatoes, peaches, almonds"
    limitations: "needs the whole fruit: in this model tomato skin and flesh are already parts"
    evidence: [escoffier, larousse]
    confidence: established

  parer:
    fr: parer
    en: trim
    categories: [separation, geometry]
    technique: trim
    requires:
      firmness: [">=medium", "trimmed to a neat shape"]
      piece: [">=medium", "large enough to trim"]
    equipment: [knife]
    effort: 1
    mechanisms: [shape_uniformity]
    outputs:
      - {name: trimmed, kind: state, set: {}}
      - {name: trimmings, kind: fraction, set: {piece: small, shape: irregular, usually_discarded: true}}
    changes: "A neat piece plus trimmings (parures) for stock or puree"
    applications: "classical prep; parures go to stocks and purees"
    established_on: [broccoli.stems, carrot.root]
    evidence: [escoffier, larousse]
    confidence: established

  epepiner:
    fr: épépiner
    en: deseed
    categories: [separation]
    technique: deseed
    requires:
      has_seed_core: [true, "needs a seed region to remove"]
    equipment: [knife]
    effort: 1
    mechanisms: [layer_separation]
    outputs:
      - {name: flesh, kind: state, set: {has_seed_core: false}, lower: {water: 1}}
      - {name: seeds, kind: fraction, from: seed_core}
    changes: "Drier flesh that holds its shape; a seed fraction"
    applications: "large courgettes, cucumbers, tomatoes"
    established_on: [courgette.fruit]
    evidence: [larousse]
    confidence: established

  evider:
    fr: évider
    en: hollow out (core)
    categories: [separation, geometry]
    technique: core
    requires:
      has_seed_core: [true, "needs a soft centre to scoop"]
      firmness: [">=medium", "the shell must stand up"]
      cut: [false, "hollow the whole fruit or halves before cutting"]
    equipment: [spoon]
    effort: 1
    mechanisms: [layer_separation]
    outputs:
      - {name: shell, kind: state, set: {has_seed_core: false, hollow: true}}
      - {name: core, kind: fraction, from: seed_core}
    changes: "A shell to fill and a soft core"
    applications: "stuffed courgettes (courgettes farcies)"
    established_on: [courgette.fruit]
    evidence: [larousse, escoffier]
    confidence: established

  equeuter:
    fr: équeuter
    en: de-stem, remove the midrib
    categories: [separation]
    requires:
      leafy: [true, "a leaf with a stalk or rib"]
      shape: ["flat", "a broad leaf with a rib"]
    equipment: [knife]
    effort: 1
    mechanisms: [layer_separation]
    outputs:
      - {name: blades, kind: state, lower: {toughness: 1, fibre: 1}}
      - {name: ribs, kind: fraction, set: {leafy: false, thin: false, flexible: false, shape: strips, usually_discarded: true}, raise: {fibre: 1, firmness: 2}}
    changes: "Tender leaf blades and the crunchy ribs"
    applications: "kale, chard, broccoli leaves"
    established_on: [broccoli.leaves]
    evidence: [cia, web_b3]
    confidence: established

  effeuiller:
    fr: effeuiller
    en: strip leaves from stalks
