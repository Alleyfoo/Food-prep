# What a material is FOR. Separate from roles (what a plate lacks) and flavour
# dimensions (what you taste); role_link names the overlap.
functions:
  # group: texture | structure | flavour | base | appearance. Usefulness counts
  # distinct groups (appearance half), so one liquid is not scored three times.
  crisp_component:   {group: texture, when: {crisp: true}, role_link: crunch}
  vegetable_noodles: {group: structure, when: {shape: ribbons, flexible: true, piece: "medium|large"}}
  wrapper:           {group: structure, when: {shape: "flat|ribbons", flexible: true, piece: "medium|large|whole", leafy: true}}
  edible_vessel:     {group: structure, when: {hollow: true}}
  thickener:         {group: structure, when: {piece: "fine|powder", smooth: false, liquid: false, gelled: false}, when_any: [{starch: ">=medium"}, {pectin: ">=medium"}, {fibre: ">=high"}], role_link: body}
  binder:            {group: structure, when: {binder: true}}
  flavour_concentrate: {group: flavour, when: {concentrated: true}}
  seasoning_powder:  {group: flavour, when: {piece: powder, water: "<=low"}}
  colouring:         {group: appearance, when: {pigment: "green|red|orange"}, when_any: [{piece: powder}, {liquid: true}]}
  sauce_base:        {group: base, when: {smooth: true}}
  broth_base:        {group: base, when: {liquid: true}, when_any: [{infused: true}, {salted: true}], role_link: hydration}
  aromatic_infusion: {group: flavour, when: {infused: true}}
  crunchy_contrast:  {group: texture, when: {firmness: ">=medium", piece: small, smooth: false, coated: false}, when_any: [{pickled: true}, {fermented: true}, {cooked: false}], role_link: crunch}
  coating:           {group: texture, when: {crisp: true, piece: "fine|powder"}}
