# Acid as a modifier — the third input of the possibility generator
# (foodprep.possibilities). Two halves:
#
# sources     things that bring acid, each with its own character. Lemon and
#             vinegar are what recipes reach for; the rest are acid sources
#             recipes rarely think of as "the acid": lingonberry, sea
#             buckthorn, rhubarb, sorrel... and parts of our own ingredients
#             (the tomato gel). These are where the Scout ideas come from.
# mechanisms  WHY acid does something to a part in a given state. A mechanism
#             applies when its part conditions and technique effects hold; any
#             source that meets its source_needs can then fill it.
#
# Levels as in part_properties.yaml. `forms` are the ways a source can be
# used, best first:
#   juice, vinegar, liquid, crushed_raw, puree, cooked_sauce, jelly, paste
#   (wet), powder, raw_shred, raw_leaf (dry or solid).
# `corpus` is a regex over a RecipeNLG ingredient field used to count how
# often the source is cooked with each ingredient (scripts/count_acid_pairs.py).

sources:
  lemon:
    acidity: very_high
    sweetness: none
    bitterness: none
    character: [citrus, fresh]
    forms: [juice]
    corpus: "(?<!pickling )\\blemons?\\b(?!\\s*(pepper|extract|zest|peel|rind|grass|curd|jell|gelatin|cake|pudding|yogh?urt|sherbet|soda|flavou?r|instant|pie filling))"
  lime:
    acidity: very_high
    sweetness: none
    bitterness: none
    character: [citrus, fresh]
    forms: [juice]
    corpus: "(?<!pickling )(?<!slaked )(?<!hydrated )(?<!key )\\blimes?\\b(?!\\s*(zest|peel|rind|leaves|jell|gelatin|sherbet|soda|flavou?r|pickling))|key limes?"
  vinegar:
    acidity: very_high
    sweetness: none
    bitterness: none
    character: [sharp]
    forms: [vinegar]
    corpus: "vinegar"
  lingonberry:
    acidity: very_high
    sweetness: low
    bitterness: medium
    astringent: true
    character: [berry, astringent, nordic]
    forms: [crushed_raw, juice, cooked_sauce, vinegar]
    season: "Late August to September in Finland; frozen all year."
    note: "Naturally rich in benzoic acid, so berries crushed raw with a little sugar keep in the fridge without cooking."
    corpus: "lingon|cowberr|partridgeberr|puolukka"
  cranberry:
    acidity: very_high
    sweetness: low
    bitterness: medium
    astringent: true
    character: [berry, astringent]
    forms: [crushed_raw, juice, cooked_sauce]
    corpus: "(?<!dried )(?<!sweetened )cranberr(?!y juice cocktail)(?!ies,? dried)"
  sea_buckthorn:
    acidity: very_high
    sweetness: low
    bitterness: low
    character: [tropical, oily, nordic]
    forms: [juice, puree]
    corpus: "sea[- ]?buckthorn|tyrni"
  redcurrant:
    acidity: high
    sweetness: low
    bitterness: low
    character: [berry, bright]
    forms: [crushed_raw, juice, jelly]
    corpus: "red currants?|redcurrants?"
  rhubarb:
    acidity: high
    sweetness: none
    bitterness: none
    character: [green, sharp]
    forms: [raw_shred, juice, cooked_sauce]
    safety: "Stalks only; rhubarb leaves are toxic."
    corpus: "rhubarb"
  sorrel:
    acidity: high
    sweetness: none
    bitterness: low
    character: [green, lemony]
    forms: [raw_leaf, puree]
    heat_risk: "Sorrel turns khaki the moment it is heated; use it raw or stirred in off the heat."
    corpus: "\\bsorrel"
  sumac:
    acidity: medium
    sweetness: none
    bitterness: low
    character: [fruity, dry]
    forms: [powder]
    corpus: "\\bsumac|sumach"
  tamarind:
    acidity: high
    sweetness: medium
    bitterness: none
    character: [fruity, dark]
    forms: [paste]
    corpus: "tamarind"
  green_mango:
    acidity: high
    sweetness: low
    bitterness: none
    character: [green, fruity]
    forms: [raw_shred, powder]
    corpus: "green mango|unripe mango|raw mango|amch[ou]o?r"
  tomato_gel:
    acidity: high
    sweetness: low
    bitterness: none
    character: [umami, fresh]
    forms: [liquid]
    from_part: tomato.seeds_and_gel
    note: "The jelly around tomato seeds, sieved: acid that also brings umami."
    corpus: "tomato"   # counts whole tomatoes; a part used as acid is never labelled by counts

mechanisms:
  brighten_browned:
    when:
      effects_any: [browning]
    source_needs: {}
    timing: finish
    does: "Acid at the end lifts the deep, sweet-bitter notes of browning."
  cut_fat:
    when:
      part: {fat: ">=high"}
    source_needs: {}
    timing: dress
    does: "Acid cuts the richness of the fat, so each bite stays light."
  slow_browning:
    when:
      part: {browns_when_cut: true}
      techniques: [raw, puree]
    source_needs:
      forms_any: [juice, vinegar, liquid, crushed_raw, puree]
    timing: dress
    does: "A wet acid coating slows the browning of the cut flesh."
  quick_pickle:
    when:
      part: {liquid: false, thin: false, water: "<=high"}
      part_any: {fibre: ">=high", toughness: ">=medium"}
      techniques: [raw]
    source_needs:
      acidity: ">=high"
      forms_any: [juice, vinegar, liquid]
    timing: marinate
    does: "Firm, fibrous pieces keep their crunch in acid while it seasons them through."
    safety: "A fridge pickle eaten within days. Shelf-stable pickling needs a tested vinegar recipe."
  soften_leaves:
    when:
      techniques: [massage]
    source_needs:
      forms_any: [juice, vinegar, liquid, crushed_raw]
    timing: marinate
    does: "Acid helps salt break down the tough raw leaves."
  lift_mild:
    when:
      part_flavour_any: [mild, sweet]
      effects_any: [softens, smooth]
    source_needs: {}
    timing: finish
    does: "A mild, soft state tastes flat without acid; a little defines it."

# Notes the generator adds on top of a mechanism.
pairing_notes:
  astringent_with_fat_or_browning: "Fat and browning soften the berry's astringency, which is why tart berries traditionally go with roasts and rich food."
risks:
  green_turns_olive: "Acid turns green chlorophyll olive within minutes of heat or hours of contact. Add it at the very end."
  reads_as_dessert: "A sweet acid can make the dish read as dessert. Keep it to a few drops."
  bitter_on_bitter: "A bitter acid on a bitter part stacks the bitterness. Balance with fat or a pinch of sugar."
