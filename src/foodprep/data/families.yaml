# Notes the generator adds on top of a mechanism.
pairing_notes:
  - id: astringent_with_fat_or_browning
    when: {member: {astringent: true}, part_or_browning: {fat: ">=high"}}
    text: "Fat and browning soften the berry's astringency, which is why tart berries traditionally go with roasts and rich food."

# Risks the generator adds. `family` limits a risk to one family; `hot_or_contact`
# means the technique is hot or the mechanism keeps the member on the part.
risks:
  - id: green_turns_olive
    when: {family: acid, part: {pigment: green}, hot_or_contact: true}
    text: "Acid turns green chlorophyll olive within minutes of heat or hours of contact. Add it at the very end."
  - id: reads_as_dessert
    when: {family_not: sweet, member_family: {sweet: ">=medium"}}
    text: "A sweet member can make the dish read as dessert. Keep it to a few drops."
  - id: bitter_on_bitter
    when: {member: {bitterness: ">=medium"}, part: {bitterness: ">=medium"}}
    text: "A bitter member on a bitter part stacks the bitterness. Balance with fat or a pinch of sugar."
  - id: salt_twice
    when: {family_not: salt, member_family: {salt: ">=high"}}
    text: "It is salty too; season the rest of the dish after adding it, not before."
