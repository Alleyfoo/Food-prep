# Families: what an ingredient brings to a dish — the third input of the
# possibility generator (foodprep.possibilities), after part_properties.yaml
# and the family states of operations.yaml.
#
# A family is one of the ontology's roles (tomato.yaml `roles` and
# `base_roles`): acid, fat, salt, umami, sweet, protein, carb. Ideas are
# generated and sorted per family, so "what acids could go on roasted
# broccoli stems" and "what proteins" are separate, comparable lists.
#
# families   kind: modifier (changes the part: acid, fat, salt, umami, sweet)
#                  or partner (completes a plate with it: protein, carb).
#            part_property: the part property that already supplies the
#                  family. A part at `high` or above gets nothing from that
#                  family (tomato gel is already acid).
#            mechanisms: WHY a member does something to a part in a given
#                  state. `when` holds conditions on the part and technique;
#                  `member_needs` on the member (strength = its level in this
#                  family; forms_any; any member property).
#
# members    Everything that can fill a family, once, with its level in each
#            family it belongs to. Soy sauce is salt very_high and umami high.
#            A member counts in a family at medium or above. `ingredient`
#            names the tomato.yaml ingredient when there is one; its
#            base_roles must all appear here (tests check this).
#            `from_part` marks a part of one of our own ingredients used as a
#            member (tomato gel, tomato skin powder).
#            `corpus` is a regex over a RecipeNLG ingredient field
#            (scripts/count_acid_pairs.py counts every member).
#
# Levels as in part_properties.yaml: none < low < medium < high < very_high.
# Forms, best first: juice, vinegar, liquid, crushed_raw, puree, cooked_sauce,
#   jelly, paste (wet); oil, solid_fat, cream (fats); crystal, powder,
#   crumble, raw_shred, raw_leaf, whole (dry or solid).

families:
  acid:
    kind: modifier
    part_property: acidity
    says: "brightens and sharpens"
    mechanisms:
      brighten_browned:
        when: {effects_any: [browning]}
        timing: finish
        does: "Acid at the end lifts the deep, sweet-bitter notes of browning."
      cut_fat:
        when: {part: {fat: ">=high"}}
        timing: dress
        does: "Acid cuts the richness of the fat, so each bite stays light."
      slow_browning:
        when: {part: {browns_when_cut: true}, techniques: [raw, puree]}
        member_needs: {forms_any: [juice, vinegar, liquid, crushed_raw, puree]}
        timing: dress
        does: "A wet acid coating slows the browning of the cut flesh."
      quick_pickle:
        when:
          part: {liquid: false, thin: false, water: "<=high"}
          part_any: {fibre: ">=high", toughness: ">=medium"}
          techniques: [raw]
        member_needs: {strength: ">=high", forms_any: [juice, vinegar, liquid]}
        timing: marinate
        does: "Firm, fibrous pieces keep their crunch in acid while it seasons them through."
        safety: "A fridge pickle eaten within days. Shelf-stable pickling needs a tested vinegar recipe."
      soften_leaves:
        when: {techniques: [massage]}
        member_needs: {forms_any: [juice, vinegar, liquid, crushed_raw]}
        timing: marinate
        does: "Acid helps salt break down the tough raw leaves."
      lift_mild:
        when: {part_flavour_any: [mild, sweet], effects_any: [softens, smooth]}
        timing: finish
        does: "A mild, soft state tastes flat without acid; a little defines it."

  fat:
    kind: modifier
    part_property: fat
    says: "carries flavour and gives body"
    mechanisms:
      brown_in_fat:
        when: {effects_any: [browning]}
        member_needs: {forms_any: [oil, solid_fat]}
        timing: cook
        does: "Fat carries the heat into every surface, so the edges brown instead of drying."
      coat_raw:
        when: {techniques: [raw, massage], part: {fat: "<=low", liquid: false}}
        member_needs: {forms_any: [oil, cream, paste]}
        timing: dress
        does: "Fat clings to lean raw pieces and carries the aromas that only dissolve in fat."
      round_bitter:
        when: {part: {bitterness: ">=medium"}}
        timing: dress
        does: "Fat coats the tongue and rounds off bitterness."
      enrich_soft:
        when: {effects_any: [softens, smooth], part: {fat: "<=low"}}
        member_needs: {forms_any: [solid_fat, oil, cream, paste]}
        timing: finish
        does: "A soft, lean state gets body and gloss from fat stirred in at the end."

  salt:
    kind: modifier
    part_property: salt
    says: "seasons and sharpens every other taste"
    mechanisms:
      draw_water:
        when: {techniques: [raw], part: {water: ">=high", liquid: false}}
        member_needs: {forms_any: [crystal]}
        timing: marinate
        does: "Salt pulls water out of watery pieces; drained, they taste stronger and stop diluting the dish."
      suppress_bitter:
        when: {part: {bitterness: ">=medium"}}
        timing: dress
        does: "Salt suppresses bitterness more than any other taste does."
      season_through:
        when: {techniques: [steam, braise, simmer]}
        member_needs: {forms_any: [crystal, liquid, paste]}
        timing: cook
        does: "Salt in the cooking liquid seasons the inside, not only the surface."
      crisp_finish:
        when: {effects_any: [crisp]}
        member_needs: {forms_any: [crystal, crumble]}
        timing: finish
        does: "Salt on a crisp surface lands in bursts instead of dissolving."

  umami:
    kind: modifier
    part_property: umami
    says: "makes it taste savoury and deep"
    mechanisms:
      deepen_mild:
        when: {part_flavour_any: [mild, sweet]}
        timing: dress
        does: "Umami gives a mild part depth, so it reads as savoury instead of bland."
      echo_browning:
        when: {effects_any: [browning]}
        timing: finish
        does: "Umami stacks on the savoury notes that browning already makes."

  sweet:
    kind: modifier
    part_property: sugar
    says: "balances sharp and bitter"
    mechanisms:
      balance_acid:
        when: {part: {acidity: ">=high"}}
        timing: dress
        does: "A little sweetness takes the edge off a sharp acid without hiding it."
      balance_bitter:
        when: {part: {bitterness: ">=medium"}}
        timing: dress
        does: "Sweetness balances bitterness, as in the honey on a bitter-leaf salad."
      glaze:
        when: {techniques: [roast]}
        member_needs: {forms_any: [liquid, crystal]}
        timing: cook
        does: "Sugar on the surface caramelises into a glaze in the oven's heat."

  protein:
    kind: partner
    part_property: protein
    says: "makes it a meal"
    mechanisms:
      yolk_as_sauce:
        when: {effects_any: [softens, browning]}
        member_needs: {runny_yolk: true}
        timing: serve
        does: "A soft yolk breaks over the vegetable and dresses it like a sauce."
      creamy_against_crisp:
        when: {effects_any: [browning, crisp]}
        member_needs: {texture: creamy}
        timing: serve
        does: "A creamy protein against browned, crisp edges gives the plate contrast."
      crisp_against_soft:
        when: {effects_any: [softens, smooth]}
        member_needs: {texture: crisp}
        timing: serve
        does: "A crisp protein gives a soft state the bite it lacks."
      same_pan:
        when: {techniques: [stir_fry]}
        member_needs: {pan_cooked: true}
        timing: cook
        does: "Cooks in the same pan at the same heat, so the meal is one step."

  carb:
    kind: partner
    part_property: carb
    says: "carries and fills"
    mechanisms:
      soak_juice:
        when: {part_any: {liquid: true, water: ">=high"}}
        member_needs: {absorbent: true}
        timing: serve
        does: "Soaks up the juice instead of leaving it on the plate."
      sauce_for_starch:
        when: {techniques: [puree, simmer]}
        member_needs: {takes_sauce: true}
        timing: serve
        does: "A smooth or simmered state becomes the sauce for the starch."
      base_for_fast:
        when: {techniques: [stir_fry]}
        member_needs: {absorbent: true}
        timing: serve
        does: "A plain base catches the pan juices of a fast, hot dish."
      crunch_on_soft:
        when: {effects_any: [softens, smooth]}
        member_needs: {texture: crisp}
        timing: serve
        does: "Crisp crumbs on a soft state give it texture."

members:
  # ---- acid -----------------------------------------------------------------
  lemon:
    ingredient: lemon
    families: {acid: very_high}
    forms: [juice]
    character: [citrus, fresh]
    corpus: "(?<!pickling )\\blemons?\\b(?!\\s*(pepper|extract|zest|peel|rind|grass|curd|jell|gelatin|cake|pudding|yogh?urt|sherbet|soda|flavou?r|instant|pie filling))"
  lime:
    ingredient: lime
    families: {acid: very_high}
    forms: [juice]
    character: [citrus, fresh]
    corpus: "(?<!pickling )(?<!slaked )(?<!hydrated )(?<!key )\\blimes?\\b(?!\\s*(zest|peel|rind|leaves|jell|gelatin|sherbet|soda|flavou?r|pickling))|key limes?"
  vinegar:
    ingredient: vinegar
    families: {acid: very_high}
    forms: [vinegar]
    character: [sharp]
    corpus: "vinegar"
  lingonberry:
    families: {acid: very_high, sweet: low}
    bitterness: medium
    astringent: true
    forms: [crushed_raw, juice, cooked_sauce, vinegar]
    character: [berry, astringent, nordic]
    season: "Late August to September in Finland; frozen all year."
    note: "Naturally rich in benzoic acid, so berries crushed raw with a little sugar keep in the fridge without cooking."
    corpus: "lingon|cowberr|partridgeberr|puolukka"
  cranberry:
    families: {acid: very_high, sweet: low}
    bitterness: medium
    astringent: true
    forms: [crushed_raw, juice, cooked_sauce]
    character: [berry, astringent]
    corpus: "(?<!dried )(?<!sweetened )cranberr(?!y juice cocktail)(?!ies,? dried)"
  sea_buckthorn:
    families: {acid: very_high}
    forms: [juice, puree]
    character: [tropical, oily, nordic]
    corpus: "sea[- ]?buckthorn|tyrni"
  redcurrant:
    families: {acid: high, sweet: low}
    forms: [crushed_raw, juice, jelly]
    character: [berry, bright]
    corpus: "red currants?|redcurrants?"
  rhubarb:
    families: {acid: high}
    forms: [raw_shred, juice, cooked_sauce]
    character: [green, sharp]
    safety: "Stalks only; rhubarb leaves are toxic."
    corpus: "rhubarb"
  sorrel:
    families: {acid: high}
    forms: [raw_leaf, puree]
    character: [green, lemony]
    heat_risk: "Sorrel turns khaki the moment it is heated; use it raw or stirred in off the heat."
    corpus: "\\bsorrel"
  sumac:
    ingredient: sumac
    families: {acid: medium, umami: low}
    forms: [powder]
    character: [fruity, dry]
    corpus: "\\bsumac|sumach"
  tamarind:
    families: {acid: high, sweet: medium}
    forms: [paste]
    character: [fruity, dark]
    corpus: "tamarind"
  green_mango:
    families: {acid: high}
    forms: [raw_shred, powder]
    character: [green, fruity]
    corpus: "green mango|unripe mango|raw mango|amch[ou]o?r"
  tomato_gel:
    families: {acid: high, umami: medium}
    forms: [liquid]
    character: [umami, fresh]
    from_part: tomato.seeds_and_gel
    note: "The jelly around tomato seeds, sieved: acid that also brings umami."
    corpus: "tomato"   # whole tomatoes; a part used as a member is never labelled by counts

  # ---- fat ------------------------------------------------------------------
