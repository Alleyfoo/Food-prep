        toughness: low
        firmness: medium
        fat: none
        sugar: low
        acidity: low
        bitterness: low
        umami: none
        raw_ok: true
        thin: true
        flexible: true
        sheetable: true
        starch: none
        pectin: low
        emulsifies: false
        holds_shape_cooked: true
        shape: ribbons
        piece: medium
        pigment: green
        flavour: [green, grassy]
        inner_changes: {}
      seed_core:
        name: seed_core
        condition: "only large courgettes have a distinct seedy core"
        edible: "yes"
        usually_discarded: true
        water: very_high
        fibre: low
        toughness: none
        firmness: none
        fat: none
        sugar: low
        acidity: low
        bitterness: low
        umami: none
        raw_ok: true
        flexible: false
        sheetable: false
        starch: none
        pectin: low
        emulsifies: false
        holds_shape_cooked: false
        shape: irregular
        piece: small
        pigment: none
        flavour: [mild]

# Parts used by documented constructions (R3, ADR 0003) that have not been
# decomposed in tomato.yaml yet (no description, provides or edibility record).
# The operation engine reads them (foodprep.operations); the family generator
# and the decomposition UI do not. Same property vocabulary as `parts`.
# Added for construction (R3):
#   water_uptake   how much water a dry material takes up when soaked or cooked
#   sets_on_heat   raw, it sets into a solid in hot fat, oven or steam
#                  (raw pulse protein and starch, R2 H4; egg, H5)
#   headed         leaves wrapped into a head (cabbage)
staged_parts:
  potato:
    tuber:
      water: high
      fibre: low
      toughness: high
      firmness: very_high
      fat: none
      sugar: low
      acidity: low
      bitterness: none
      umami: low
      raw_ok: false
      pigment: none
      flavour: [earthy, mild]
      shape: round
      piece: whole
      flexible: false
      sheetable: true
      starch: high
      pectin: medium
      emulsifies: false
      holds_shape_cooked: true
      note: "Waxy potatoes hold their shape and take up less oil (E4b, M15b); floury ones mash. Variety is not modelled."
      outer_layer:
        name: potato_skin
        edible: "yes"
        usually_discarded: true
        water: medium
        fibre: high
        toughness: medium
        firmness: medium
        fat: none
        sugar: low
        acidity: low
        bitterness: low
        umami: low
        raw_ok: false
        thin: true
        flexible: true
        sheetable: false
        starch: low
        pectin: medium
        emulsifies: false
        holds_shape_cooked: true
        shape: flat
        piece: small
        pigment: none
        flavour: [earthy]
        inner_changes: {}

