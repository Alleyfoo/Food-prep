  carrot:
    root:
      water: high
      fibre: medium
      toughness: high
      firmness: very_high
      fat: none
      sugar: medium
      acidity: low
      bitterness: none
      umami: none
      raw_ok: true
      pigment: orange
      flavour: [sweet, earthy]
