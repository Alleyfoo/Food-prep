      sheetable: false
      starch: none
      pectin: low
      emulsifies: false
      holds_shape_cooked: false
      outer_layer:
        name: onion_skin
        edible: "no"
        usually_discarded: true
        water: low
        fibre: high
        toughness: high
        firmness: low
        thin: true
        flexible: false
