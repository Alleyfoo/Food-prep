        name: carrot_peel
        edible: "yes"
        usually_discarded: true
        water: medium
        fibre: high
        toughness: low
        firmness: medium
        fat: none
        sugar: low
        acidity: low
        bitterness: low
        umami: none
        raw_ok: true
        thin: true
        flexible: true
        sheetable: true
        starch: low
        pectin: medium
        emulsifies: false
        holds_shape_cooked: true
        shape: ribbons
        piece: medium
        pigment: orange
        flavour: [earthy, bitter]
        inner_changes: {}
    greens:
      water: medium
      fibre: high
      toughness: medium
      firmness: low
      fat: none
      sugar: low
      acidity: low
      bitterness: high
      umami: none
      raw_ok: true
      thin: true
      leafy: true
      pigment: green
      flavour: [green, bitter, grassy]
      shape: feathery
      piece: large
      flexible: true
      sheetable: false
      starch: none
      pectin: low
      emulsifies: false
      holds_shape_cooked: false
      usually_discarded: true
      note: "Edible, parsley family; bitter. Do not confuse with wild look-alikes such as hemlock."

  courgette:
    fruit:
      water: very_high
      fibre: low
      toughness: low
      firmness: medium
      fat: none
      sugar: low
      acidity: low
      bitterness: none
      umami: none
      raw_ok: true
      pigment: green
      flavour: [mild, green]
      shape: cylindrical
      piece: whole
      flexible: false
      sheetable: true
      starch: none
      pectin: low
      emulsifies: false
      holds_shape_cooked: false
      note: "Taste a tiny raw piece first: discard any very bitter courgette (cucurbitacin; cooking does not remove it)."
      outer_layer:
        name: courgette_skin
        edible: "yes"
