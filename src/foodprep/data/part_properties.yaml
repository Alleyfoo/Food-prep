# What each ingredient part physically is — the input of the possibility
# generator (foodprep.possibilities). Hand-curated; no recipe decides it.
#
# Whether a part is food is NOT repeated here: it comes from `parts` in
# tomato.yaml (edible / not_food_reason). A part that is not food gets no
# techniques, whatever its properties say.
#
# Levels: none < low < medium < high < very_high.
#   water       how much free water it holds (decides frying, drying)
#   fibre       how fibrous it is (decides braising, pickling crunch)
#   toughness   how hard it is to bite raw (decides raw use, massage)
#   fat, sugar, acidity, bitterness, umami   taste-relevant composition
#   (salt, protein and carb are none unless given)
# Flags (true/false):
#   raw_ok            pleasant to eat raw
#   thin              thin sheets or leaves (dries and crisps fast)
#   leafy             a leaf, which salt, oil and acid can soften raw
#   liquid            a liquid or gel rather than a solid
#   browns_when_cut   enzymatic browning on cut surfaces
# pigment: green | red | none (green turns olive with acid and time)
# flavour: words matched by the acid mechanisms (mild, sweet, rich, ...)
# only_techniques: limits a conditional part to the techniques that make it
#   worth eating (tomato core: only a stock).
#
# Added for the operation model (Culinary Operations R1, foodprep.operations).
# There a property that is not stated is UNKNOWN, never false, except the flags
# above (recorded only when true) and state flags only an operation sets.
#   firmness          holds a cut shape (none .. very_high)
#   shape             cylindrical | round | tree | flat | feathery | irregular
#   piece             whole | large | medium | small | fine | powder
#   flexible          bends without breaking
#   sheetable         gives long continuous ribbons or sheets
#   starch, pectin    levels; thickening and setting potential
#   emulsifies        holds fat and water together when blended
#   holds_shape_cooked  keeps its shape through cooking
#   usually_discarded cooks mostly throw it away (S2 counts, or common practice)
#   outer_layer       a peel that is not a part of its own: its properties, and
#                     `inner_changes` for the body once it is peeled
#   seed_core         a soft seed region that can be scooped out
#   heat_sensitive    turns bitter or off with long heat (recorded only when true)

parts:
  broccoli:
    florets:
      water: medium
      fibre: medium
      toughness: low
      fat: none
      sugar: low
      acidity: low
      bitterness: low
      raw_ok: true
      pigment: green
      flavour: [green, mild, sulfurous]
      firmness: medium
      shape: tree
      piece: medium
      flexible: false
      sheetable: false
      starch: low
      pectin: low
      emulsifies: false
      holds_shape_cooked: true
    stems:
      water: medium
      fibre: high
      toughness: medium
      fat: none
      sugar: medium
      acidity: low
      bitterness: none
      raw_ok: true
      pigment: green
      flavour: [sweet, mild, green]
      note: "Peel the tough outer layer first; inside it is dense and sweet, like kohlrabi."
      firmness: high
      shape: cylindrical
      piece: large
      flexible: false
      sheetable: true
      starch: low
      pectin: low
      emulsifies: false
      holds_shape_cooked: true
      outer_layer:
        name: stem_peel
        edible: "yes"
        usually_discarded: true
        water: low
        fibre: very_high
        toughness: high
        firmness: medium
        fat: none
        sugar: low
        acidity: low
        bitterness: low
        umami: none
        raw_ok: false
        thin: true
        flexible: true
        sheetable: false
        starch: low
        pectin: low
        emulsifies: false
        holds_shape_cooked: true
        shape: strips
        piece: small
        pigment: green
        flavour: [green, bitter]
        inner_changes: {toughness: low, fibre: medium}
    leaves:
      water: medium
      fibre: high
      toughness: medium
      fat: none
      sugar: low
      acidity: low
      bitterness: medium
      raw_ok: true
      thin: true
      leafy: true
      pigment: green
      flavour: [green, bitter, cabbage]
      firmness: low
      shape: flat
      piece: large
      flexible: true
      sheetable: true
      starch: none
      pectin: low
      emulsifies: false
      holds_shape_cooked: false
      usually_discarded: true

  tomato:
    flesh:
      water: high
      fibre: low
      toughness: low
      fat: none
      sugar: medium
      acidity: medium
      bitterness: none
      umami: low
      raw_ok: true
      pigment: red
      flavour: [sweet, sour, fresh]
      firmness: low
      shape: irregular
      piece: medium
      flexible: false
      sheetable: false
      starch: none
      pectin: medium
      emulsifies: false
      holds_shape_cooked: false
    seeds_and_gel:
      water: very_high
      fibre: none
      toughness: none
      fat: none
      sugar: low
      acidity: high
      bitterness: none
      umami: medium
      raw_ok: true
      liquid: true
      pigment: red
      flavour: [sour, umami, fresh]
      firmness: none
      shape: irregular
      piece: fine
      flexible: false
      sheetable: false
      starch: none
      pectin: medium
      emulsifies: false
      holds_shape_cooked: false
      usually_discarded: true
    skin:
      water: low
      fibre: medium
      toughness: medium
      fat: none
      sugar: low
      acidity: low
      bitterness: low
      umami: high
      raw_ok: true
      thin: true
      pigment: red
      flavour: [umami]
      firmness: low
      shape: flat
      piece: small
      flexible: true
      sheetable: false
      starch: none
      pectin: medium
      emulsifies: false
      holds_shape_cooked: true
      usually_discarded: true
    core:
      water: medium
      fibre: medium
      toughness: high
      fat: none
      sugar: low
      acidity: low
      bitterness: none
      raw_ok: false
      pigment: none
      flavour: [mild]
      only_techniques: [simmer]
      only_operations: [decocter]   # the operation model's other way to make a stock
      firmness: high
      shape: irregular
      piece: small
      flexible: false
      sheetable: false
      starch: none
      pectin: low
      emulsifies: false
      holds_shape_cooked: true
      usually_discarded: true
      note: "Edible but hard; worth it only simmered in a stock or a sieved sauce."

  avocado:
    flesh:
      water: medium
      fibre: low
      toughness: low
