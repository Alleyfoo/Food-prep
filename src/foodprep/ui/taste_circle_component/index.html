<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Taste Circle Map — custom Streamlit component (no build step).

  Renders the flavour-dimension circle with vis-network (vendored locally,
  same 9.1.2 build pyvis uses) and reports node clicks back to Streamlit
  using the component v1 postMessage protocol, implemented inline so the
  component has zero CDN dependencies.

  Protocol (iframe -> parent): postMessage({isStreamlitMessage: true, type, ...}, "*")
    - "streamlit:componentReady"     {apiVersion: 1}
    - "streamlit:setComponentValue"  {value: <json>, dataType: "json"}
    - "streamlit:setFrameHeight"     {height: <px>}
  Protocol (parent -> iframe): message event, event.data.type === "streamlit:render",
  with event.data.args holding the keyword args passed from Python.
-->
<script src="./vis-network.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #F4F2EC;
    overflow: hidden;
  }
  #taste-circle {
    width: 100%;
  }
  #taste-circle-error {
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #B23B2E;
    padding: 1em;
  }
</style>
</head>
<body>
<div id="taste-circle"></div>
<script>
(function () {
  "use strict";

  var container = document.getElementById("taste-circle");

  // ---- minimal Streamlit component v1 protocol --------------------------
  function sendBackMsg(type, data) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true, type: type }, data), "*"
    );
  }
  function setFrameHeight(height) {
    sendBackMsg("streamlit:setFrameHeight", { height: height });
  }
  function setComponentValue(value) {
    sendBackMsg("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  if (typeof vis === "undefined" || !vis.Network) {
    container.innerHTML =
      '<div id="taste-circle-error">Could not load the graph renderer ' +
      '(vis-network.min.js missing next to index.html).</div>';
    sendBackMsg("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight(80);
    return;
  }

  var network = null;
  var nodeSet = null;

  var OPTIONS = {
    physics: { enabled: false },
    interaction: { hover: true, tooltipDelay: 120, zoomView: true, dragView: true },
    nodes: {
      shape: "dot",
      font: {
        size: 13,
        face: 'system-ui, -apple-system, "Segoe UI", sans-serif',
        color: "#1A1B16"
      },
      borderWidth: 1.5
    },
    edges: { smooth: false, width: 1.5 }
  };

  function onRender(data) {
    var args = data.args || {};
    var height = args.height || 640;
    container.style.height = height + "px";

    nodeSet = new vis.DataSet(args.nodes || []);
    var graphData = { nodes: nodeSet, edges: new vis.DataSet(args.edges || []) };

    if (!network) {
      network = new vis.Network(container, graphData, OPTIONS);
      // Test/debug hook: lets e2e tests resolve node pixel positions.
      window.__tasteCircle = network;

      network.on("click", function (params) {
        if (params.nodes.length > 0) {
          var node = nodeSet.get(params.nodes[0]);
          if (node && node.clickable === false) { return; }
          setComponentValue({ id: params.nodes[0], t: Date.now() });
        } else {
          // Click on blank canvas: lets the app close the open "pop-up".
          setComponentValue({ id: null, t: Date.now() });
        }
      });
      network.on("hoverNode", function (params) {
        var node = nodeSet.get(params.node);
        container.style.cursor = (node && node.clickable === false) ? "default" : "pointer";
      });
      network.on("blurNode", function () { container.style.cursor = "default"; });
    } else {
      network.setOptions(OPTIONS);
      network.setData(graphData);
    }
    network.fit({ animation: false });
    setFrameHeight(height + 4);
  }

  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "streamlit:render") {
      onRender(event.data);
    }
  });

  sendBackMsg("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
