# Benchmark: established preparations the generator should recover.
#
# Each item is a preparation documented outside the model: the web check of
# existing practice (sources.md, web_… ids) or the curated transformations in
# tomato.yaml (curated:…). An item is a starting part and an operation
# sequence; benchmark.py applies the sequence, identifies the final material,
# and looks for it in the generator's output.
#
# Not every item is a fair test, and the score must say so:
# - The property values in part_properties.yaml were written by the same author
#   who knew these preparations. That leakage cannot be removed, only named.
# - `established_on` in operations.yaml was filled partly from the same web
#   check. benchmark.py ranks with it switched off (use_established=False) to
#   remove that leak.
# - `expect: blocked` marks items the model is known to reject, with the reason.
# - `expect: beyond_depth` marks items longer than the generator's depth (3).
# - `expect: not_representable` marks items that need an operation the engine
#   does not have (recombining processed materials, mixing into a batter); they
#   are listed for the record and not evaluated.
#
# Matching is by final MATERIAL, not by exact sequence: an item counts as
# recovered when the generator reaches the same material (same part, fraction,
# properties and added ingredients), whichever path it shows. That is the right
# test for material discovery, and it is stated in the results.

